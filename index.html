<style>
:root{
  --bg:#F4F5F6;
  --surface:#FFFFFF;
  --surface-2:#F9FAFA;
  --ink:#20281F;
  --ink-soft:#4A4F42;
  --primary:#00B794;
  --primary-2:#00C9A3;
  --text-heading:#173E37;
  --sidebar-bg:#0D182D;
  --sidebar-bg-2:#141F38;
  --sidebar-accent:#0B4642;
  --logo-teal:#00B794;
  --gold:#B8863A;
  --gold-soft:#E4C88C;
  --positive:#2E7D5B;
  --negative:#AD4B34;
  --line:#E4E0D6;
  --gray-100:#EDEBE3;
  --gray-400:#9C978A;
  --gray-700:#4A473E;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(23,34,25,.06), 0 4px 16px rgba(23,34,25,.05);
  --font-display: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-body: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --type-entrada:#2E7D5B;
  --type-despesa:#B23B2E;
  --type-transferencia:#C9A227;
  --type-investimento:#2E5C8A;
}
body.dark-theme{
  --bg:#0F1420;
  --surface:#171D2C;
  --surface-2:#1D2436;
  --ink:#E8EAF0;
  --ink-soft:#A8AEBD;
  --primary:#00B794;
  --primary-2:#00C9A3;
  --text-heading:#FFFFFF;
  --sidebar-bg:#0D182D;
  --sidebar-bg-2:#141F38;
  --sidebar-accent:#0B4642;
  --logo-teal:#00B794;
  --line:#2A3245;
  --gray-100:#232B3D;
  --gray-400:#7A8296;
  --gray-700:#C3C8D4;
}
body.dark-theme .sidebar{ background:var(--sidebar-bg); }
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;}
::selection{background:#B8E5DC;}

#app{display:none;height:100vh;}
#app.ready{display:flex;}

/* ---- CONNECT SCREEN ---- */
#connectScreen{
  height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:
    radial-gradient(circle at 15% 20%, rgba(0,183,148,.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(11,70,66,.12), transparent 45%),
    var(--bg);
  text-align:center;padding:24px;
}
.logo-mark-lg{
  width:56px;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none;
}
.logo-mark-lg svg{width:32px;height:32px;}
.brand-lockup{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;}
#connectScreen .mark{
  font-family:'Trebuchet MS','Century Gothic',Verdana,system-ui,sans-serif;font-size:38px;font-weight:700;color:var(--text-heading);letter-spacing:.5px;
}
#connectScreen .slogan{
  font-family:var(--font-body);font-size:12.5px;letter-spacing:2.5px;color:var(--logo-teal);font-weight:600;
  text-transform:uppercase;margin-top:12px;text-align:center;
}
#connectScreen p.sub{color:var(--ink-soft);max-width:420px;margin:18px 0 30px;line-height:1.5;}
.connect-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;display:inline-flex;
  align-items:center;gap:8px;transition:.15s ease;
}
.btn:hover{border-color:#0E5A55;box-shadow:var(--shadow);}
.btn.primary{background:var(--sidebar-accent);color:#fff;border-color:var(--sidebar-accent);}
.btn.primary:hover{background:#0E5A55;border-color:#0E5A55;}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
.btn.danger{color:var(--negative);border-color:var(--negative);background:#F5E0DC;}
.btn.danger:hover{background:var(--negative);color:#fff;}
.btn.danger-solid{color:#fff;border-color:var(--negative);background:var(--negative);}
.btn.danger-solid:hover{background:#F5E0DC;color:var(--negative);}
.search-box{border:1.5px solid var(--gray-400);border-radius:var(--radius-sm);padding:4px 10px;transition:.15s;}
.search-box:focus-within{border-color:var(--gray-400);}
.search-box input:focus{outline:none;}
.btn.small{padding:6px 12px;font-size:12.5px;}
.btn-create{
  display:inline-flex;align-items:center;gap:10px;border:none;background:var(--sidebar-accent);
  color:#fff;font-weight:700;padding:6px 18px 6px 6px;border-radius:30px;transition:.15s;box-shadow:0 2px 8px rgba(11,70,66,.25);
}
.btn-create:hover{background:#0E5A55;}
.btn-create .badge-plus{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.btn-create .badge-plus svg{width:14px;height:14px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
#connectScreen .hint{margin-top:26px;font-size:12px;color:var(--gray-400);}

/* ---- LAYOUT ---- */
.sidebar{
  width:216px;flex:none;background:var(--sidebar-bg);color:#EFEAE0;display:flex;flex-direction:column;
  padding:20px 14px;
}
.sidebar .brand{
  font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.3px;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px 4px;
}
.brand-lockup-sb{display:flex;align-items:center;justify-content:center;gap:4px;}
.sidebar .brand svg.logo-mark-sm{width:24px;height:24px;flex:none;}
.sidebar .brand small{display:block;font-family:var(--font-body);font-size:12.5px;letter-spacing:.2px;color:#fff;text-transform:none;font-weight:500;margin-top:4px;}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
  color:#A8ADB8;text-decoration:none;font-weight:500;font-size:14px;transition:.12s;
}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--sidebar-accent);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.10);}
.conn-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);background:rgba(255,255,255,.05);margin-bottom:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--positive);flex:none;box-shadow:0 0 0 3px rgba(46,125,91,.25);transition:background .2s;}
.dot.saving{background:var(--gold);box-shadow:0 0 0 3px rgba(184,134,58,.3);animation:dotpulse 1s ease-in-out infinite;}
@keyframes dotpulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.conn-pill .fname{font-size:11.5px;color:#D9D4C4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{
  height:auto;min-height:64px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:20px;
}
.month-switch{display:flex;align-items:center;gap:10px;flex:none;}
.month-switch button{border:1px solid var(--line);background:var(--surface);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.month-switch button:hover{border-color:var(--gray-400);color:var(--text-heading);}
.month-label{font-family:var(--font-display);font-size:15px;font-weight:600;min-width:130px;text-align:center;white-space:nowrap;}
.topbar-title{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-heading);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.view{flex:1;overflow:auto;padding:24px 28px 60px;}
.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.view-header h1{font-family:var(--font-display);font-size:24px;margin:0;font-weight:600;color:var(--text-heading);}
.view-header .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}

/* ledger strip (signature) */
.ledger-strip{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
}
.ledger-strip::before{
  content:"";position:absolute;left:26px;right:26px;top:50%;height:2px;
  background:repeating-linear-gradient(90deg,var(--line) 0 6px, transparent 6px 12px);
  z-index:0;
}
.ledger-node{position:relative;z-index:1;text-align:center;flex:1;}
.ledger-node .dotm{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2.5px solid var(--primary-2);margin:0 auto 10px;}
.ledger-node.previsto .dotm{border-color:var(--gold);border-style:dashed;}
.ledger-node .lbl{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gray-400);font-weight:700;}
.ledger-node .val{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:4px;}
.neg{color:var(--negative);}
.pos{color:var(--positive);}
.ledger-node .val.neg{color:var(--negative);}
.ledger-node .val.pos{color:var(--positive);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi-grid.cols4-max{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.kpi-grid.cols4-max{grid-template-columns:repeat(2,1fr);}}
.kpi-grid.cols3{grid-template-columns:repeat(3,1fr);}
.kpi-grid.cols4{grid-template-columns:repeat(4,1fr);}
.kpi-grid.cols5{grid-template-columns:repeat(5,1fr);}
@media(max-width:820px){.kpi-grid.cols3{grid-template-columns:repeat(2,1fr);} .kpi-grid.cols4{grid-template-columns:repeat(2,1fr);} .kpi-grid.cols5{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;height:102px;box-sizing:border-box;overflow:hidden;}
.kpi-card.compact{padding:16px 18px;}
.lbl{font-size:12.5px;text-transform:none;color:var(--gray-700);font-weight:600;}
.val{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:6px;}
.kpi-card .lbl{font-size:12.5px;text-transform:none;color:var(--gray-700);font-weight:600;}
.kpi-card .val{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:6px;}
.kpi-card .val.neg{color:var(--negative);}
.kpi-card .val.pos{color:var(--positive);}
.val.neg{color:var(--negative);}
.val.pos{color:var(--positive);}
.kpi-card .sub{font-size:11.5px;color:var(--gray-400);margin-top:4px;}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;margin-bottom:20px;}
@media(max-width:980px){.grid2{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.card.ribbon-padrao{position:relative;overflow:hidden;}
.card.ribbon-padrao::before{
  content:"";position:absolute;top:0;left:0;border-style:solid;
  border-width:34px 34px 0 0;border-color:var(--positive) transparent transparent transparent;z-index:1;
}
.card.ribbon-padrao::after{
  content:"★";position:absolute;top:3px;left:3px;color:#fff;font-size:11px;z-index:2;line-height:1;
}
.card h3{margin:0 0 12px;font-size:14px;font-family:var(--font-display);font-weight:600;color:var(--text-heading);}
.bar-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:13px;padding:2px 0;}

.dash-row{display:flex;align-items:center;gap:14px;padding:14px 6px;cursor:pointer;}
.dash-row:last-child{border-bottom:none;}
.dash-row:hover{background:var(--surface-2);}
.dash-row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.dash-row-name{font-weight:700;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dash-icon-circle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;flex:none;}
.dash-icon-circle svg{width:17px;height:17px;}
.dash-row-vals{text-align:right;flex:none;}
.dash-row-atual{font-family:var(--font-display);font-size:22px;font-weight:600;}
.dash-row-atual.neg{color:var(--negative);}
.dash-row-previsto{font-size:11.5px;color:var(--gray-400);margin-top:2px;}
.dash-detail-btn{color:var(--gray-400);flex:none;}
.dash-detail-btn:hover{color:var(--ink);background:var(--gray-100);}
.bar-row .name{width:130px;flex:none;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:8px;background:var(--gray-100);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary-2);border-radius:6px;}
.bar-fill.over{background:var(--negative);}
.bar-row .amt{width:78px;flex:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
tfoot td{background:var(--surface-2);padding:8px;}
th{text-align:left;padding:9px 10px;color:var(--gray-400);font-weight:700;font-size:10.8px;letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.table-toolbar{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;}
.table-scroll{overflow-x:auto;}
.tbl-compact-lanc td{border-bottom:1px solid var(--surface-2);padding:6px 10px;}
.tbl-compact-lanc td.valor-destaque{font-size:12.8px;font-weight:600;}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface);color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid #4A473E;outline-offset:1px;border-color:#4A473E;}
label.field,div.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:12px;}
.req-star{color:var(--negative);font-weight:700;margin-left:2px;}
label.field{flex-wrap:wrap;}
label.field.field-error{color:var(--negative);}
label.field.field-error input,label.field.field-error select,label.field.field-error .custom-select-trigger{
  border-color:var(--negative)!important;box-shadow:0 0 0 2px rgba(173,75,52,.15);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11.3px;font-weight:600;background:var(--gray-100);color:var(--gray-700);}
.chip.entrada{background:#DEEFE6;color:var(--type-entrada);}
.chip.despesa{background:#F5E0DC;color:var(--type-despesa);}
.chip.transferencia{background:#F4ECC9;color:#8A6F16;}
.chip.investimento{background:#DCE7F1;color:var(--type-investimento);}
.chip.transferencia{background:#F0E9D8;color:var(--gold);}
.chip-x{cursor:pointer;opacity:.6;}
.chip-x:hover{opacity:1;}
.pill-select{display:flex;gap:6px;flex-wrap:wrap;}
.mov-tipo-toggle{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px;flex:none;}
.mov-tipo-opt{height:34px;padding:0 12px;border-radius:8px;border:none;background:transparent;color:var(--gray-400);display:flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;transition:.15s;font-size:12.5px;font-weight:600;white-space:nowrap;}
.mov-tipo-opt svg{width:16px;height:16px;}
.mov-tipo-opt:hover{color:var(--ink);}
.mov-tipo-opt.entrada.active{background:var(--positive);color:#fff;}
.mov-tipo-opt.saida.active{background:var(--negative);color:#fff;}
.pill-opt{border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--surface);display:inline-flex;align-items:center;gap:5px;}
.pill-opt.pill-create{border-style:dashed;border-color:var(--gold);color:var(--gold);}
.pill-opt.pill-create:hover{background:var(--gold-soft);}
.pill-opt.sm{padding:4px 10px;font-size:11.5px;}

.parcel-box{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);padding:10px 12px;margin-bottom:14px;}
.parcel-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.parcel-field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.parcel-field-row:last-of-type{margin-bottom:10px;}
.parcel-field-row label{font-size:12px;font-weight:600;color:var(--ink-soft);flex:none;}
.parcel-field-row input[type=number]{width:80px;padding:5px 8px;}
.pill-opt.active{background:var(--sidebar-accent);color:#fff;border-color:var(--sidebar-accent);}
.pill-opt.active.tipo-entrada{background:var(--type-entrada);border-color:var(--type-entrada);}
.pill-opt.active.tipo-despesa{background:var(--type-despesa);border-color:var(--type-despesa);}
.pill-opt.active.tipo-transferencia{background:var(--type-transferencia);border-color:var(--type-transferencia);color:#4A3D0A;}
.pill-opt.active.tipo-investimento{background:var(--type-investimento);border-color:var(--type-investimento);}

.badge-status{padding:3px 9px;border-radius:20px;font-size:10.8px;font-weight:700;letter-spacing:.3px;}
.badge-status.efetivado{background:#DEEFE6;color:var(--positive);}
.badge-status.previsto{background:#F3EAD4;color:var(--gold);}
.badge-status.aberta-azul{background:#DCE9F5;color:#2E5C8A;}

.rowcolor{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}
.tt-icon{width:15px;height:15px;vertical-align:middle;display:inline-flex;}
.tt-icon svg{width:100%;height:100%;}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--gray-700);}
.icon-btn-topbar{color:var(--gray-700);width:38px;height:38px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;}
.icon-btn:hover{background:var(--gray-100);border-color:var(--line);}
.icon-btn.danger:hover{background:#F5E2DC;color:var(--negative);}
.icon-btn svg{width:14px;height:14px;}
#btnEscolherFoto svg{width:11px;height:11px;}

.empty-state{padding:50px 20px;text-align:center;color:var(--gray-400);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}

.fab{
  position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;
  background:var(--sidebar-accent);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(11,70,66,.35);border:none;z-index:40;
}
.fab:hover{background:#0E5A55;}
.fab svg{width:22px;height:22px;transition:transform .18s ease;}
.fab.open svg{transform:rotate(45deg);}

.fab-menu{
  position:fixed;bottom:92px;right:28px;z-index:41;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 12px 34px rgba(23,34,25,.18);padding:8px;display:none;flex-direction:column;
  gap:2px;min-width:210px;
}
.fab-menu.open{display:flex;}
.fab-menu button{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;color:var(--ink);text-align:left;width:100%;
}
.fab-menu button:hover{background:var(--surface-2);}
.fab-menu .dotc{width:9px;height:9px;border-radius:50%;flex:none;}
.fab-menu .dotc.entrada{background:var(--type-entrada);}
.fab-menu .dotc.despesa{background:var(--type-despesa);}
.fab-menu .dotc.transferencia{background:var(--type-transferencia);}
.fab-menu .dotc.investimento{background:var(--type-investimento);}
.fab-backdrop{position:fixed;inset:0;z-index:39;display:none;}
.fab-backdrop.open{display:block;}

/* modal / portal */
.portal-overlay{position:fixed;inset:0;background:rgba(23,28,20,.42);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:40px 16px;}
.portal-modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.portal-modal.wide{max-width:760px;}
.portal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.portal-head h2{margin:0;font-family:var(--font-display);font-size:18px;color:var(--text-heading);}
.portal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
.portal-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--line);align-items:center;}
.close-x{border:none;background:transparent;color:var(--gray-400);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px;}
.close-x:hover{background:var(--gray-100);}

.confirm-box{max-width:400px;}
.confirm-box p{color:var(--ink-soft);line-height:1.5;}

.tag-token{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;font-size:11px;font-weight:600;background:#DCF0EB;color:#0B4642;}
.mini-note{font-size:11.5px;color:var(--gray-400);margin-top:4px;}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(-6px);transition:.2s;}
.toast.show{opacity:1;transform:translateY(0);}

.cat-tree-node{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;}
.cat-tree-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
.cat-tree-head:hover{background:var(--surface-2);}
.cat-tree-children{padding:4px 14px 10px 16px;}
.cat-tree-child{display:flex;align-items:center;justify-content:space-between;padding:9px 6px;border-bottom:1px dashed var(--line);font-size:13px;border-radius:6px;}
.cat-tree-child:last-child{border-bottom:none;}
.cat-row-click{cursor:pointer;transition:.1s;}
.cat-row-click:hover{background:var(--surface-2);}
.cat-row-main{display:flex;align-items:center;flex:1;min-width:0;}
.cat-tree-child:last-child{border-bottom:none;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tabs-card{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px;margin-bottom:18px;}
.tabs-card .tab-btn{border-radius:8px;border-bottom:none;display:flex;align-items:center;gap:7px;position:relative;}
.tabs-card .tab-btn svg{width:15px;height:15px;}
.tabs-card .tab-btn.active{background:var(--surface-2);}
.tabs-card .tab-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:currentColor;}
.tabs-card-sm{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:12px;}
.tabs-card-sm .tab-btn{padding:5px 10px;border-radius:6px;border-bottom:none;display:flex;align-items:center;gap:5px;position:relative;font-size:12px;}
.tabs-card-sm .tab-btn svg{width:12px;height:12px;}
.tabs-card-sm .tab-btn.active{background:var(--surface-2);}
.tabs-card-sm .tab-btn.active::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:2px;border-radius:2px;background:currentColor;}
.tab-btn{padding:9px 16px;border:none;background:transparent;font-weight:600;color:var(--gray-400);border-bottom:2px solid transparent;font-size:13px;}
.tab-btn.active{color:var(--text-heading);border-color:var(--primary);}
.tab-btn.tab-despesa.active{color:var(--negative);border-color:var(--type-despesa);}
.tab-btn.tab-entrada.active{color:var(--positive);border-color:var(--type-entrada);}
.tab-btn.tab-investimento.active{color:var(--type-investimento);border-color:var(--type-investimento);}
.tab-btn.tab-transferencia.active{color:var(--gold);border-color:var(--type-transferencia);}
.tab-btn.tab-conta.active{color:var(--gold);border-color:var(--gold);}
.pill-tipo{display:flex;gap:8px;flex-wrap:wrap;}
.pill-tipo-btn{padding:8px 18px;border-radius:999px;border:1.5px solid var(--gray-100);background:var(--bg);color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;transition:.15s;}
.pill-tipo-btn:hover{border-color:var(--gray-400);}
.pill-tipo-btn.entrada.active{background:var(--type-entrada);border-color:var(--type-entrada);color:#fff;}
.pill-tipo-btn.despesa.active{background:var(--negative);border-color:var(--negative);color:#fff;}
.pill-tipo-btn.transferencia.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.pill-tipo-btn.investimento.active{background:var(--type-investimento);border-color:var(--type-investimento);color:#fff;}
.pill-tipo-btn.active-neutral{background:#DFF0E4;border-color:#DFF0E4;color:var(--positive);}
.pill-tipo-btn-sm{padding:8px 14px;border-radius:999px;border:1.5px solid var(--gray-100);background:var(--bg);color:var(--ink-soft);font-weight:600;font-size:11.5px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
.pill-tipo-btn-sm svg{width:12px;height:12px;}
.pill-tipo-btn-sm:hover{border-color:var(--gray-400);}
.pill-tipo-btn-sm.entrada.active{background:var(--type-entrada);border-color:var(--type-entrada);color:#fff;}
.pill-tipo-btn-sm.despesa.active{background:var(--negative);border-color:var(--negative);color:#fff;}
.pill-tipo-btn-sm.investimento.active{background:var(--type-investimento);border-color:var(--type-investimento);color:#fff;}
.pill-tipo-btn-sm.active-neutral{background:#DFF0E4;border-color:#DFF0E4;color:var(--positive);}

.progress-mini{height:6px;background:var(--gray-100);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-mini > div{height:100%;background:var(--primary-2);}
.progress-mini > div.over{background:var(--negative);}

.asset-type-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--gray-100);color:var(--gray-700);text-transform:uppercase;letter-spacing:.4px;}

.color-picker{position:relative;display:inline-block;}
.color-trigger{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0;cursor:pointer;flex:none;}

.custom-select{position:relative;}
.custom-select-trigger{
  width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;
  background:var(--surface);display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;box-sizing:border-box;
}
.custom-select-trigger:hover{border-color:var(--gray-400);}
.tags-input-trigger{
  width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:6px 8px;background:var(--surface);min-height:38px;
}
.tags-input-trigger:focus-within{border-color:#4A473E;outline:2px solid #4A473E;}
.tags-input-trigger input{border:none;outline:none;flex:1;min-width:100px;padding:2px;background:transparent;}
.csel-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.color-popover{
  position:fixed;z-index:150;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 10px 28px rgba(23,34,25,.25);padding:12px;width:190px;
}
.repeat-chip{
  display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;color:var(--ink);
  text-align:left;
}
.repeat-chip:hover{border-color:var(--gray-400);}
.repeat-popover.color-popover{width:280px;position:absolute;}
.select-with-icon{position:relative;display:flex;align-items:center;}
.select-with-icon .tt-icon{position:absolute;left:10px;color:var(--gray-400);pointer-events:none;z-index:1;}
.select-with-icon select{padding-left:32px;width:100%;}
.color-group-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px 5px;margin-bottom:8px;}
.color-group-col{display:flex;flex-direction:column;gap:3px;align-items:center;}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;}
.color-swatch.sm{width:16px;height:16px;}
.color-swatch.sel{border-color:var(--ink);}
.color-custom-wrap{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.color-custom-wrap input[type=color]{width:28px;height:26px;padding:1px;flex:none;border-radius:6px;}

.icon-swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:6px;}
.icon-swatch{font-size:13px;color:var(--ink);padding:9px 0;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;}
.icon-swatch svg{width:22px;height:22px;}
.icon-swatch.sel{border-color:var(--primary-2);background:var(--gold-soft);}
.icon-preview-btn{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.icon-preview-btn svg{width:17px;height:17px;}
.icon-preview-btn:hover{border-color:var(--gray-400);}
.cat-circle{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:none;}
.cat-circle svg{width:13px;height:13px;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:16px;}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .ti h4{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);}
.toggle-row .ti p{margin:3px 0 0;font-size:12px;color:var(--gray-400);max-width:440px;line-height:1.5;}
.switch{position:relative;width:44px;height:25px;flex:none;background:var(--gray-100);border-radius:20px;border:1px solid var(--line);cursor:pointer;transition:.15s;}
.switch.on{background:var(--positive);border-color:var(--positive);}
.switch .knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s;}
.switch.on .knob{left:23px;}

.efetivar-dot{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:2px solid var(--gray-400);cursor:pointer;transition:.15s;color:#fff;}
.efetivar-dot.disabled{cursor:default;}
.efetivar-dot.disabled:not(.on){background:var(--gray-400);border-color:var(--gray-400);opacity:.6;}
.efetivar-dot.disabled:hover{border-color:var(--gray-400);}
/* linhas de cartão mantêm o mesmo aspecto visual das demais — apenas o círculo de efetivar sinaliza o status */
.efetivar-dot svg{width:11px;height:11px;opacity:0;transition:.12s;}
.efetivar-dot.on{background:var(--positive);border-color:var(--positive);}
.efetivar-dot.on svg{opacity:1;}
.efetivar-dot:hover{border-color:var(--gray-400);}

.kebab-btn{color:var(--gray-400);}
.kebab-btn:hover{color:var(--ink);background:var(--gray-100);}
.fab-menu-item{
  display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:transparent;
  border-radius:6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
.fab-menu-item:hover{background:var(--surface-2);}
.fab-menu-item.danger{color:var(--negative);}

.two-col-form{display:grid;grid-template-columns:1fr;gap:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D8D3C6;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

const SCHEMA_VERSION = "1.0.3";

function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    meta:{ createdAt: new Date().toISOString(), lastModified: new Date().toISOString() },
    configuracoes:{ orcamentoAfetaPrevisto:false, mostrarApenasContasComSaldo:false, lastUsedCategoria:{entrada:[null,null], despesa:[null,null], investimento:[null,null]}, lastUsedCartaoId:null, temaEscuro:false, ordenacaoDecrescente:true, lancPageSizePadrao:10, fusoHorario:"-03:00", ocultarValoresAoAbrir:false },
    contas:[],
    cartoes:[],
    categorias:[],
    tags:[],
    lancamentos:[],
    orcamentos:[],
    investimentos:{ ativos:[], aportes:[], atualizacoes:[] },
    metas:[],
    perfil:{ nome:"", email:"", fotoDataUrl:null },
  };
}

// Ensures full shape + fixes minor inconsistencies. Never destructive.
function normalizeState(raw){
  const s = raw && typeof raw === "object" ? raw : {};
  const out = defaultState();
  out.schemaVersion = SCHEMA_VERSION;
  out.meta = Object.assign(out.meta, s.meta||{});
  out.configuracoes = Object.assign(out.configuracoes, s.configuracoes||{});
  out.configuracoes.lastUsedCategoria = Object.assign({entrada:[null,null], despesa:[null,null], investimento:[null,null]}, out.configuracoes.lastUsedCategoria||{});
  out.contas = Array.isArray(s.contas) ? s.contas.map(c=>({
    id:c.id||uid("conta"), nome:c.nome||"Conta", tipo:c.tipo||"corrente",
    saldoInicial:Number(c.saldoInicial)||0, cor:c.cor||"#173E37", moeda:c.moeda||"BRL",
    categoriaContaId:c.categoriaContaId||null,
    icone: c.icone || ({corrente:"bank",poupanca:"piggy",carteira:"wallet",investimento:"investment"}[c.tipo]||"bank"),
    oculta: c.oculta===true,
    arquivada: c.arquivada===true,
    padrao: c.padrao===true,
    ativo:c.ativo!==false
  })) : [];
  out.cartoes = Array.isArray(s.cartoes) ? s.cartoes.map(c=>({
    id:c.id||uid("cartao"), nome:c.nome||"Cartão", contaVinculada:c.contaVinculada||null,
    bandeira:c.bandeira||"outros", ultimosDigitos:c.ultimosDigitos||"",
    diaFechamento:Number(c.diaFechamento)||25, diaVencimento:Number(c.diaVencimento)||5,
    limite:Number(c.limite)||0, cor:c.cor||"#B8863A", icone:c.icone||"card", padrao:c.padrao===true, ativo:c.ativo!==false
  })) : [];
  out.categorias = Array.isArray(s.categorias) ? s.categorias.map(c=>({
    id:c.id||uid("cat"), nome:c.nome||"Categoria", tipo:c.tipo||"despesa",
    categoriaPaiId:c.categoriaPaiId||null, cor:c.cor||"#9C978A",
    icone: c.icone || (c.tipo==="conta" ? "bank" : null),
    arquivada: c.arquivada===true
  })) : [];
  // Limpeza: investimento é categoria de 1 nível só; remove subcategorias "Outros" criadas por engano em versão anterior
  const catsInvComFilhoIndevido = out.categorias.filter(c=>c.tipo==="investimento" && c.categoriaPaiId);
  if(catsInvComFilhoIndevido.length){
    const idsRemover = new Set(catsInvComFilhoIndevido.map(c=>c.id));
    out.categorias = out.categorias.filter(c=>!idsRemover.has(c.id));
  }
  // Migration: categoria+subcategoria agora são obrigatórias em lançamentos.
  // Garante que toda categoria de nível 1 (exceto tipo "conta"/"investimento", que são de 1 nível só) tenha ao menos uma subcategoria.
  out.categorias.filter(c=>!c.categoriaPaiId && c.tipo!=="conta" && c.tipo!=="investimento").forEach(pai=>{
    const temFilha = out.categorias.some(c=>c.categoriaPaiId===pai.id);
    if(!temFilha){
      out.categorias.push({ id:uid("cat"), nome:"Outros", tipo:pai.tipo, categoriaPaiId:pai.id, cor:"#9C978A", icone:"other" });
    }
  });
  out.tags = Array.isArray(s.tags) ? s.tags.map(t=>({ id:t.id||uid("tag"), nome:t.nome||"Tag", cor:t.cor||"#B8863A" })) : [];
  out.lancamentos = Array.isArray(s.lancamentos) ? s.lancamentos.map(l=>({
    id:l.id||uid("lanc"),
    tipo:l.tipo||"despesa", // entrada | despesa | investimento | transferencia
    nome: l.nome || l.descricao || (l.tipo==="transferencia" ? "Transferência" : ""),
    valor:Math.abs(Number(l.valor))||0,
    data:l.data||new Date().toISOString().slice(0,10),
    hora:l.hora||"00:00",
    criadoEm: l.criadoEm || ((l.data||new Date().toISOString().slice(0,10)) + "T" + (l.hora||"00:00") + ":00.000Z"),
    categoriasSplits: Array.isArray(l.categoriasSplits) ? l.categoriasSplits.map(s=>({categoriaId:s.categoriaId||null, subcategoriaId:s.subcategoriaId||null, valor:Number(s.valor)||0})) : null,
    contaId:l.contaId||null,
    cartaoId:l.cartaoId||null,
    competenciaFatura: l.competenciaFatura || null,
    contaDestinoId:l.contaDestinoId||null,
    categoriasIds:Array.isArray(l.categoriasIds)?l.categoriasIds:[],
    tagsIds:Array.isArray(l.tagsIds)?l.tagsIds:[],
    descricao: l.nome ? (l.descricao||"") : "",
    efetivado: l.efetivado===true,
    dataEfetivacao: l.dataEfetivacao || null,
    grupoPagamento: l.grupoPagamento || null,
    origemPagamentoGrupo: l.origemPagamentoGrupo || null,
    recorrencia: l.recorrencia && l.recorrencia.ativa ? {
      ativa:true, frequencia:l.recorrencia.frequencia||"mensal",
      intervalo: Number(l.recorrencia.intervalo)||1,
      grupoId:l.recorrencia.grupoId||uid("rec"),
      tipo: l.recorrencia.tipo||"fixo",
      valorTipo: l.recorrencia.valorTipo||"parcela",
      totalParcelas: l.recorrencia.totalParcelas||null,
      parcelaAtual: l.recorrencia.parcelaAtual||null,
      parcelaInicial: l.recorrencia.parcelaInicial||1,
      dataTermino: l.recorrencia.dataTermino||null,
    } : {ativa:false},
  })) : [];
  out.orcamentos = Array.isArray(s.orcamentos) ? s.orcamentos.map(o=>({
    id:o.id||uid("orc"), categoriaId:o.categoriaId||null, mesReferencia:o.mesReferencia||null, // null = repete todo mês
    validoApartirDe: o.validoApartirDe || null, // data a partir da qual um orçamento recorrente passa a valer
    valorPlanejado:Number(o.valorPlanejado)||0,
    historicoValores: Array.isArray(o.historicoValores) ? o.historicoValores.map(h=>({desde:h.desde, valor:Number(h.valor)||0})) : []
  })) : [];
  const inv = s.investimentos||{};
  out.investimentos.ativos = Array.isArray(inv.ativos) ? inv.ativos.map(a=>({
    id:a.id||uid("ativo"), nome:a.nome||"Ativo", categoriaId:a.categoriaId||null, tipoLegado:a.tipo||null, contaId:a.contaId||null,
    saldoInicial:Number(a.saldoInicial)||0, dataCriacao:a.dataCriacao||null, ativo:a.ativo!==false
  })) : [];
  // Migração: tipo (texto livre) de investimento vira categoria de verdade
  out.investimentos.ativos.forEach(a=>{
    if(a.categoriaId) return;
    const nomeTipo = a.tipoLegado || "Outro";
    let cat = out.categorias.find(c=>c.tipo==="investimento" && c.nome.toLowerCase()===nomeTipo.toLowerCase());
    if(!cat){
      cat = { id:uid("cat"), nome:nomeTipo, tipo:"investimento", categoriaPaiId:null, cor:"#2E5C8A", icone:"investment" };
      out.categorias.push(cat);
    }
    a.categoriaId = cat.id;
  });
  out.investimentos.aportes = Array.isArray(inv.aportes) ? inv.aportes.map(a=>({
    id:a.id||uid("aporte"), ativoId:a.ativoId||null, data:a.data||new Date().toISOString().slice(0,10),
    valor:Number(a.valor)||0, tipo:a.tipo||"aporte", // aporte | resgate
    categoriaId:a.categoriaId||null, tagsIds:Array.isArray(a.tagsIds)?a.tagsIds:[],
    contaId:a.contaId||null, transferenciaGrupoId:a.transferenciaGrupoId||null,
    lancamentoVinculadoId:a.lancamentoVinculadoId||null,
    criadoEm:a.criadoEm||new Date().toISOString(),
    efetivado: a.efetivado!==false
  })) : [];
  out.investimentos.atualizacoes = Array.isArray(inv.atualizacoes) ? inv.atualizacoes.map(a=>({
    id:a.id||uid("atual"), ativoId:a.ativoId||null, data:a.data||new Date().toISOString().slice(0,10),
    valorAtual:Number(a.valorAtual)||0,
    criadoEm:a.criadoEm||new Date().toISOString()
  })) : [];
  out.metas = Array.isArray(s.metas) ? s.metas.map(m=>({
    id:m.id||uid("meta"), nome:m.nome||"Meta", valorAlvo:Number(m.valorAlvo)||0,
    valorAtual:Number(m.valorAtual)||0, dataAlvo:m.dataAlvo||null, cor:m.cor||"#2E5C8A",
    icone:m.icone||"target", concluida:m.concluida===true, criadoEm:m.criadoEm||new Date().toISOString(),
    descricao: m.descricao || "",
    movimentos: Array.isArray(m.movimentos) ? m.movimentos.map(mv=>({
      id:mv.id||uid("metamov"), data:mv.data||new Date().toISOString().slice(0,10),
      valor:Number(mv.valor)||0, tipo:mv.tipo==="saida"?"saida":"entrada"
    })) : []
  })) : [];
  const p = s.perfil || {};
  out.perfil = { nome: p.nome||"", email: p.email||"", fotoDataUrl: p.fotoDataUrl||null };
  return out;
}

let state = defaultState();
let fileHandle = null;
let writeTimer = null;

/* =========================================================
   INDEXEDDB — file handle persistence
========================================================= */
const IDB_NAME="dolfin-db", IDB_STORE="handles", IDB_KEY="fileHandle";
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
  });
}
async function idbSet(val){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(val, IDB_KEY);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = ()=>res(rq.result||null);
    rq.onerror = ()=>rej(rq.error);
  });
}
async function idbClear(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}

/* =========================================================
   FILE SYSTEM ACCESS
========================================================= */
async function verifyPermission(handle, forWrite){
  const opts = forWrite ? {mode:"readwrite"} : {};
  if((await handle.queryPermission(opts))==="granted") return true;
  if((await handle.requestPermission(opts))==="granted") return true;
  return false;
}

async function readFileHandle(handle){
  const file = await handle.getFile();
  const text = await file.text();
  return text.trim() ? JSON.parse(text) : {};
}

async function writeFileHandle(handle, data){
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

let lastSyncAt = null;
function fmtLastSync(d){
  const dia = String(d.getDate()).padStart(2,"0");
  const mes = String(d.getMonth()+1).padStart(2,"0");
  const ano = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${dia}/${mes}/${ano} às ${hh}:${mm}`;
}
function updateLastSyncLabel(){
  const lbl = document.getElementById("lastSyncLabel");
  if(!lbl) return;
  lbl.textContent = lastSyncAt ? fmtLastSync(lastSyncAt) : "—";
}
async function persist(immediate){
  if(!fileHandle) return;
  state.meta.lastModified = new Date().toISOString();
  clearTimeout(writeTimer);
  const setSaving = (saving)=>{
    const dot = document.getElementById("connDot");
    const lbl = document.getElementById("saveStatusLabel");
    if(dot) dot.classList.toggle("saving", saving);
    if(lbl){ lbl.style.display = saving ? "inline" : "none"; lbl.textContent = saving ? "Salvando..." : ""; }
  };
  const doWrite = ()=>{
    setSaving(true);
    return writeFileHandle(fileHandle, state).then(()=>{
      lastSyncAt = new Date();
      updateLastSyncLabel();
    }).catch(e=>{
      showToast("Erro ao salvar: "+e.message);
    }).finally(()=> setSaving(false));
  };
  if(immediate){ await doWrite(); } else { writeTimer = setTimeout(doWrite, 300); }
}

async function tryReconnect(){
  try{
    const handle = await idbGet();
    if(!handle) return false;
    if((await handle.queryPermission({mode:"readwrite"}))==="granted"){
      const raw = await readFileHandle(handle);
      state = normalizeState(raw);
      fileHandle = handle;
      bootApp();
      return true;
    }
    // permissão precisa de um clique real do usuário: mostra botão de reconexão em 1 clique
    const btn = document.getElementById("btnReconnect");
    const wrap = document.getElementById("reconnectActions");
    if(btn && wrap){
      btn.textContent = `Reconectar a "${handle.name}"`;
      wrap.style.display = "flex";
      btn.onclick = async ()=>{
        try{
          if(!(await verifyPermission(handle, true))){
            document.getElementById("connectHint").textContent = "Permissão negada. Escolha o arquivo manualmente abaixo.";
            return;
          }
          const raw = await readFileHandle(handle);
          state = normalizeState(raw);
          fileHandle = handle;
          bootApp();
        }catch(e){
          document.getElementById("connectHint").textContent = "Não foi possível reconectar: "+e.message;
        }
      };
    }
    return false;
  }catch(e){ return false; }
}

function openMiniCalculator(triggerEl, initialValue, onResult){
  document.querySelectorAll(".mini-calc-pop").forEach(m=>m.remove());
  let expr = initialValue ? String(initialValue).replace(".",",") : "";
  const r = triggerEl.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "color-popover open mini-calc-pop";
  pop.style.position = "fixed";
  pop.style.top = (r.bottom+6)+"px";
  pop.style.left = Math.min(r.left-160, window.innerWidth-220)+"px";
  pop.style.width = "200px";
  const keys = ["7","8","9","÷","4","5","6","×","1","2","3","-","0",",","=","+"];
  pop.innerHTML = `
    <div id="calcDisplay" style="background:var(--surface-2);border-radius:6px;padding:8px 10px;text-align:right;font-family:var(--font-mono);font-size:16px;margin-bottom:8px;min-height:20px;">${expr||"0"}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
      ${keys.map(k=>`<button type="button" class="btn small calc-key" data-key="${k}" style="justify-content:center;">${k}</button>`).join("")}
    </div>
    <button type="button" class="btn ghost small" id="calcClear" style="width:100%;margin-top:6px;justify-content:center;">Limpar</button>`;
  document.body.appendChild(pop);
  const display = pop.querySelector("#calcDisplay");
  function refresh(){ display.textContent = expr || "0"; }
  pop.querySelectorAll(".calc-key").forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();

    if(k==="="){
      try{
        const safeExpr = expr.replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/[^0-9.+\-*/()]/g,"");
        const result = Function('"use strict";return ('+safeExpr+')')();
        if(isFinite(result)){
          onResult(Number(result));
          pop.remove();

      return;
    }
    expr += k;
    refresh();
  });
  pop.querySelector("#calcClear").onclick = (e)=>{ e.stopPropagation(); expr=""; refresh(); };

}

let currentMonth = new Date(); currentMonth.setDate(1); currentMonth.setHours(0,0,0,0);
const MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function competenciaAberta(cartao){
  if(!cartao) return null;
  const hoje = new Date();
  const base = hoje.getDate() >= cartao.diaFechamento ? new Date(hoje.getFullYear(), hoje.getMonth()+1, 1) : hoje;
  return monthKey(base);
}
function fmtMonthLabel(d){
  const nome = MONTH_NAMES[d.getMonth()];
  return nome.charAt(0).toUpperCase()+nome.slice(1)+" de "+d.getFullYear();
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function nowLocalIso(){ return todayStr()+"T"+nowTimeStr(); }
function isInMonth(dateStr, monthDate){
  if(!dateStr) return false;
  return dateStr.slice(0,7) === monthKey(monthDate);
}
function sortByData(itens, campo){
  campo = campo || "data";
  const dir = state.configuracoes.ordenacaoDecrescente===false ? 1 : -1;
  return itens.sort((a,b)=>{
    const cmp = a[campo].localeCompare(b[campo]);
    if(cmp!==0) return dir * cmp;
    const ha = a.hora||"", hb = b.hora||"";
    return dir * ha.localeCompare(hb);
  });
}
function mesCompetencia(l){
  if(l.efetivado && l.dataEfetivacao) return l.dataEfetivacao.slice(0,7);
  if(l.cartaoId && l.competenciaFatura) return l.competenciaFatura;
  return l.data ? l.data.slice(0,7) : null;
}
function isInMonthCompetencia(l, monthDate){
  return mesCompetencia(l) === monthKey(monthDate);
}
let valoresOcultos = false;
function round2(v){
  const n = Number(v)||0;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}
function ehNegativo(v){
  const n = round2(v);
  return n < 0;
}
function fmtMoney(v){
  if(valoresOcultos) return "R$ ••••••";
  let n = round2(v);
  if(Object.is(n, -0)) n = 0;
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function fmtMoneyIn(v, moeda){
  if(valoresOcultos) return "••••••";
  let n = round2(v);
  if(Object.is(n, -0)) n = 0;
  try{ return n.toLocaleString("pt-BR",{style:"currency",currency:moeda||"BRL"}); }
  catch(e){ return fmtMoney(n); }
}
function fmtDate(d){
  if(!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function fmtDateHora(l){
  const dataStr = fmtDate(l.data);
  return l.hora ? `${dataStr} <span style="display:inline;color:inherit;">${l.hora}</span>` : dataStr;
}

/* =========================================================
   COLOR PICKER — 12 preset swatches (+ light/dark shades) + custom
========================================================= */
const COLOR_PRESETS = ["#AD4B34","#E0562E","#B8863A","#C9A227","#3FA34D","#2E7D5B","#173E37","#3C7A8A",
  "#1FA6A6","#2E5C8A","#6E4E9E","#D6336C","#8A5A44","#5E6B4A","#9C978A","#4A473E"];
function contrastIconColor(hex){
  hex = (hex||"#173E37").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16);
  const r=(num>>16)&0xFF, g=(num>>8)&0xFF, b=num&0xFF;
  const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
  return luminance > 0.62 ? "#20281F" : "#FFFFFF";
}
function shadeColor(hex, percent){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16);
  let r=(num>>16), g=(num>>8&0x00FF), b=(num&0x0000FF);
  const amt = Math.round(2.55*percent);
  r = Math.min(255,Math.max(0,r+amt));
  g = Math.min(255,Math.max(0,g+amt));
  b = Math.min(255,Math.max(0,b+amt));
  return "#"+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
const COLOR_PRESETS_LIGHT = COLOR_PRESETS.map(c=>shadeColor(c,28));
const COLOR_PRESETS_DARK = COLOR_PRESETS.map(c=>shadeColor(c,-22));

      </div>

const CATEGORY_ICON_KEYS = Object.keys(CATEGORY_ICON_SVGS);
const LEGACY_EMOJI_ICON_MAP = {
  "🍔":"food","🚗":"car","🏠":"home","💊":"health","🎓":"education","🎮":"leisure","👕":"clothes",
  "✈️":"plane","💰":"salary","📈":"investment","💡":"bills","🐾":"pet","🎁":"gift","📱":"phone",
  "⚽":"sport","🛒":"cart","⛽":"fuel","💳":"card","🧾":"tax","🔧":"tools","📚":"books","🎵":"music",
  "💼":"briefcase","❓":"other"
};
function resolveIconKey(icone){
  if(!icone) return "";
  if(CATEGORY_ICON_SVGS[icone]) return icone;
  if(LEGACY_EMOJI_ICON_MAP[icone]) return LEGACY_EMOJI_ICON_MAP[icone];
  return "";
}
function iconPickerHtml(fieldId, current, keys){
  const cur = resolveIconKey(current);
  return `
    <div class="icon-picker" data-field="${fieldId}" data-keys="${(keys||CATEGORY_ICON_KEYS).join(',')}">
      <button type="button" class="icon-preview-btn" id="${fieldId}_trigger">${cur?CATEGORY_ICON_SVGS[cur]:'<span class="mini-note" style="margin:0;">Escolher</span>'}</button>
      <input type="hidden" id="${fieldId}" value="${cur}">
    </div>`;
}
function wireIconPicker(overlay, fieldId){
  const wrap = overlay.querySelector(`.icon-picker[data-field="${fieldId}"]`);
  if(!wrap) return;
  const input = overlay.querySelector("#"+fieldId);
  const trigger = overlay.querySelector("#"+fieldId+"_trigger");
  const opts = (wrap.dataset.keys||"").split(",").filter(Boolean);
  let pop = null;
  function closePop(){ if(pop){ pop.remove(); pop=null; } }
  function openPop(){
    closePop();
    const r = trigger.getBoundingClientRect();
    pop = document.createElement("div");
    pop.className = "color-popover open";
    pop.style.position = "fixed";
    const estimatedHeight = 260;
    const abreParaCima = (r.bottom + estimatedHeight) > window.innerHeight && r.top > estimatedHeight;
    pop.style.top = abreParaCima ? (r.top - estimatedHeight - 6)+"px" : (r.bottom+6)+"px";
    pop.style.left = Math.min(r.left, window.innerWidth-220)+"px";
    pop.style.width = "220px";
    pop.style.maxHeight = "260px";
    pop.style.overflowY = "auto";
    pop.innerHTML = `<div class="icon-swatch-grid">
        <button type="button" class="icon-swatch ${!input.value?'sel':''}" data-icon="">—</button>
        ${opts.map(k=>`<button type="button" class="icon-swatch ${input.value===k?'sel':''}" data-icon="${k}">${CATEGORY_ICON_SVGS[k]}</button>`).join("")}
      </div>`;
    document.body.appendChild(pop);
    pop.querySelectorAll(".icon-swatch").forEach(sw=>{
      sw.onclick = (e)=>{
        e.stopPropagation();
        input.value = sw.dataset.icon;
        trigger.innerHTML = sw.dataset.icon ? CATEGORY_ICON_SVGS[sw.dataset.icon] : '<span class="mini-note" style="margin:0;">Escolher</span>';
        closePop();
      };
    });
    pop.addEventListener("click", e=>e.stopPropagation());
  }
  trigger.onclick = (e)=>{ e.stopPropagation(); if(pop) closePop(); else openPop(); };
  document.addEventListener("click", ()=> closePop());
}

      <button type="button" class="custom-select-trigger" id="${fieldId}_trigger">
        ${cur?`${iconOf(cur)}<span style="font-weight:600;">${cur.label}</span>`:`<span class="mini-note" style="margin:0;">${placeholder||'Selecionar'}</span>`}
      </button>
      <input type="hidden" id="${fieldId}" value="${currentId||''}">
    </div>`;
}

function tagsTriggerHtml(fieldId, selectedIds){

function wireTagsPopover(overlay, fieldId, selectedIds, onToggle){
  const trigger = overlay.querySelector("#"+fieldId+"_trigger");
  const searchInput = overlay.querySelector("#"+fieldId+"_search");
  if(!trigger || !searchInput) return;
  let pop = null;
  let search = "";
  function closePop(){ if(pop){ pop.remove(); pop=null; } }
  function renderList(){
    if(!pop) return;
    const filtered = state.tags.filter(t=>t.nome.toLowerCase().includes(search.toLowerCase()));
    const exists = state.tags.some(t=>t.nome.toLowerCase()===search.trim().toLowerCase());
    pop.innerHTML = filtered.map(t=>`<button type="button" class="fab-menu-item" data-tagid="${t.id}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>${t.nome}</span>${selectedIds.includes(t.id)?`<span class="tt-icon">${ICONS.check}</span>`:""}
      </button>`).join("") +
      (search.trim() && !exists ? `<button type="button" class="fab-menu-item" id="tagsPopCreate" style="color:var(--sidebar-accent);"><span class="tt-icon">${ICONS.plus}</span> Criar “${search.trim()}”</button>` : "") +
      (!filtered.length && !search.trim() ? `<div class="mini-note" style="padding:6px;">Nenhuma tag ainda — comece a digitar para criar.</div>` : "");
    pop.querySelectorAll("[data-tagid]").forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); onToggle(b.dataset.tagid); search=""; searchInput.value=""; closePop(); });
    const createBtn = pop.querySelector("#tagsPopCreate");
    if(createBtn) createBtn.onclick = (e)=>{
      e.stopPropagation();
      const novaTag = { id:uid("tag"), nome:search.trim(), cor:COLOR_PRESETS[Math.floor(Math.random()*COLOR_PRESETS.length)] };
      state.tags.push(novaTag);
      onToggle(novaTag.id);
      search = "";
      searchInput.value = "";
      closePop();
    };
  }
  function openPop(){
    closePop();
    const r = trigger.getBoundingClientRect();
    pop = document.createElement("div");
    pop.className = "color-popover open";
    pop.style.position = "fixed";
    pop.style.top = (r.bottom+6)+"px";
    pop.style.left = Math.min(r.left, window.innerWidth-260)+"px";
    pop.style.width = "240px";
    pop.style.maxHeight = "220px";
    pop.style.overflow = "auto";
    document.body.appendChild(pop);
    renderList();
    pop.addEventListener("click", e=>e.stopPropagation());
  }
  searchInput.addEventListener("focus", ()=> openPop());
  searchInput.addEventListener("input", (e)=>{ search = e.target.value; if(!pop) openPop(); else renderList(); });
  searchInput.addEventListener("click", (e)=> e.stopPropagation());
  document.addEventListener("click", ()=> closePop());
}

// signed value of a lançamento with respect to a given contaId (for saldo calc)
function signedValueForConta(l, contaId){
  if(l.tipo==="transferencia"){
    if(l.contaId===contaId) return -l.valor;
    if(l.contaDestinoId===contaId) return l.valor;
    return 0;
  }
  if(l.contaId!==contaId) return 0;
  return l.tipo==="entrada" ? l.valor : -l.valor;
}

function saldoContaAte(contaId, dateStrInclusive, onlyEfetivados){
  const conta = contaById(contaId); if(!conta) return 0;
  let total = conta.saldoInicial;
  state.lancamentos.forEach(l=>{
    if(onlyEfetivados && !l.efetivado) return;
    const dataEfetiva = (l.efetivado && l.dataEfetivacao) ? l.dataEfetivacao.slice(0,10) : l.data;
    if(dateStrInclusive && dataEfetiva > dateStrInclusive) return;
    total += signedValueForConta(l, contaId);
  });
  state.investimentos.aportes.forEach(a=>{
    if(a.contaId!==contaId) return;
    if(onlyEfetivados && !a.efetivado) return;
    if(dateStrInclusive && a.data > dateStrInclusive) return;
    total += a.tipo==="resgate" ? a.valor : -a.valor;
  });
  return round2(total);
}
function mesImpactoConta(l){
  if(!l.cartaoId) return l.data ? l.data.slice(0,7) : null;
  const cartao = cartaoById(l.cartaoId);
  if(!cartao) return l.data ? l.data.slice(0,7) : null;
  const comp = l.competenciaFatura || l.data.slice(0,7);
  const [y,m] = comp.split("-").map(Number);
  const mesVenc = cartao.diaVencimento < cartao.diaFechamento ? new Date(y, m, 1) : new Date(y, m-1, 1);
  return monthKey(mesVenc);
}
function saldoPrevistoConta(contaId, monthDate){
  const fimMes = ultimoDiaMes(monthDate);
  const mesKeyAlvo = monthKey(monthDate);
  const atual = saldoContaAte(contaId, todayStr()<fimMes?todayStr():fimMes, true);
  let previstosNoMes = 0;
  state.lancamentos.forEach(l=>{
    if(l.efetivado) return;
    const impacto = mesImpactoConta(l);
    if(!impacto || impacto > mesKeyAlvo) return;
    previstosNoMes += signedValueForConta(l, contaId);
  });
  state.investimentos.aportes.forEach(a=>{
    if(a.contaId!==contaId || a.efetivado) return;
    if(!a.data || a.data.slice(0,7) > mesKeyAlvo) return;
    previstosNoMes += a.tipo==="resgate" ? a.valor : -a.valor;
  });
  return round2(atual + previstosNoMes);
}

function saldoTotalAte(dateStrInclusive, onlyEfetivados){
  return round2(state.contas.filter(c=>c.ativo).reduce((sum,c)=> sum + saldoContaAte(c.id, dateStrInclusive, onlyEfetivados), 0));
}

function primeiroDiaMes(monthDate){ return monthKey(monthDate)+"-01"; }
function ultimoDiaMes(monthDate){
  const d = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
  return d.toISOString().slice(0,10);
}
function diaAnteriorA(dateStr){
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function despesasVencidasNaoPagas(dateStrInclusive){
  let total = 0;
  state.lancamentos.forEach(l=>{
    if(l.tipo!=="despesa" || l.efetivado) return;
    if(l.cartaoId){
      const cartao = cartaoById(l.cartaoId);
      if(!cartao) return;
      const comp = l.competenciaFatura || l.data.slice(0,7);
      const [y,m] = comp.split("-").map(Number);
      const mesVenc = cartao.diaVencimento < cartao.diaFechamento ? new Date(y, m, 1) : new Date(y, m-1, 1);
      const vencStr = new Date(mesVenc.getFullYear(), mesVenc.getMonth(), cartao.diaVencimento).toISOString().slice(0,10);
      if(vencStr <= dateStrInclusive) total += l.valor;
    } else {
      if(l.data <= dateStrInclusive) total += l.valor;
    }
  });
  return total;
}
function dashboardSaldos(monthDate){
  const inicioMes = primeiroDiaMes(monthDate);
  const fimMes = ultimoDiaMes(monthDate);
  const diaAnterior = diaAnteriorA(inicioMes);
  const saldoInicial = saldoTotalAte(diaAnterior, true) - despesasVencidasNaoPagas(diaAnterior);
  const saldoAtual = saldoTotalAte(todayStr() < fimMes ? todayStr() : fimMes, true);
  let saldoPrevisto = state.contas.filter(c=>c.ativo).reduce((sum,c)=> sum + saldoPrevistoConta(c.id, monthDate), 0);
  if(state.configuracoes.orcamentoAfetaPrevisto){
    const mesKey = monthKey(monthDate);
    const orcamentosDoMes = state.orcamentos.filter(o=> o.mesReferencia===mesKey || (!o.mesReferencia && (!o.validoApartirDe || mesKey>=monthKey(new Date(o.validoApartirDe+"T00:00:00")))));
    orcamentosDoMes.forEach(o=>{
      const cat = categoriaById(o.categoriaId); if(!cat) return;
      if(cat.tipo==="investimento") return; // aportes sem conta vinculada não projetam saída futura do saldo
      const realizado = realizadoOrcamento(o, monthDate);
      const restante = valorPlanejadoEfetivo(o, monthDate) - realizado;
      if(restante<=0) return;
      if(cat.tipo==="entrada") saldoPrevisto += restante;
      else saldoPrevisto -= restante; // despesa: saída futura prevista
    });
  }
  return {saldoInicial, saldoAtual, saldoPrevisto};
}

function lancamentosDoMes(monthDate){
  return state.lancamentos.filter(l=> isInMonthCompetencia(l, monthDate));
}

/* =========================================================
   RECORRÊNCIA — generate future occurrences
========================================================= */
function addFreq(dateStr, freq, n, intervalo){
  intervalo = intervalo||1;
  const d = new Date(dateStr+"T00:00:00");
  const passos = n*intervalo;
  if(freq==="diario" || freq==="dia") d.setDate(d.getDate()+passos);
  else if(freq==="semanal") d.setDate(d.getDate()+7*n);
  else if(freq==="quinzenal") d.setDate(d.getDate()+15*n);
  else if(freq==="bimestral") d.setMonth(d.getMonth()+2*n);
  else if(freq==="trimestral") d.setMonth(d.getMonth()+3*n);
  else if(freq==="anual" || freq==="ano") d.setFullYear(d.getFullYear()+passos);
  else d.setMonth(d.getMonth()+passos); // mensal/mes default
  return d.toISOString().slice(0,10);
}

function gerarOcorrenciasRecorrencia(base, horizonte){
  horizonte = (horizonte===undefined || horizonte===null) ? 11 : horizonte; // gera + 11 meses à frente (12 no total) para lançamentos fixos
  const grupo = base.recorrencia.grupoId;
  const isParcelado = base.recorrencia.tipo==="parcelado";
  const total = base.recorrencia.totalParcelas;
  const baseNome = isParcelado ? (base.nome||"").replace(/\s*\(\d+\/\d+\)\s*$/,"") : base.nome;
  const novos = [];
  for(let i=1;i<=horizonte;i++){
    const novaDataCalculada = addFreq(base.data, base.recorrencia.frequencia, i, base.recorrencia.intervalo);
    if(!isParcelado && base.recorrencia.dataTermino && novaDataCalculada > base.recorrencia.dataTermino) break;
    const parcelaAtual = isParcelado ? (base.recorrencia.parcelaAtual||1)+i : null;
    let novaCompetencia = base.competenciaFatura;
    if(base.cartaoId && base.competenciaFatura){
      const [cy,cm] = base.competenciaFatura.split("-").map(Number);
      const d = new Date(cy, cm-1+i, 1);
      novaCompetencia = monthKey(d);
    }
    // parcelas de cartão mantêm a data/hora da compra original; a fatura (competência) é quem avança de fato
    const novaData = (isParcelado && base.cartaoId) ? base.data : novaDataCalculada;
    novos.push(Object.assign({}, base, {
      id: uid("lanc"),
      data: novaData,
      competenciaFatura: novaCompetencia,
      efetivado:false,
      dataEfetivacao:null,
      nome: isParcelado && total ? `${baseNome} (${parcelaAtual}/${total})` : base.nome,
      recorrencia:Object.assign({}, base.recorrencia, {parcelaAtual}),
    }));
  }
  return novos;
}

function computarAlertasGlobais(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const hojeStr = hoje.toISOString().slice(0,10);
  const daqui3dias = (()=>{ const d=new Date(hoje); d.setDate(d.getDate()+3); return d.toISOString().slice(0,10); })();
  const despesasPendentes = state.lancamentos.filter(l=> l.tipo==="despesa" && !l.efetivado && !l.cartaoId && l.data<=daqui3dias).sort((a,b)=> a.data.localeCompare(b.data));
  const entradasPendentes = state.lancamentos.filter(l=> l.tipo==="entrada" && !l.efetivado && l.data<=daqui3dias).sort((a,b)=> a.data.localeCompare(b.data));
  const transferenciasPendentes = state.lancamentos.filter(l=> l.tipo==="transferencia" && !l.efetivado && l.data<=daqui3dias).sort((a,b)=> a.data.localeCompare(b.data));
  const faturasPendentes = [];
  state.cartoes.filter(c=>c.ativo).forEach(cartao=>{
    const competenciasComPendencia = new Set(
      state.lancamentos.filter(l=> l.cartaoId===cartao.id && !l.efetivado && l.competenciaFatura).map(l=>l.competenciaFatura)
    );
    competenciasComPendencia.forEach(mesKeyRef=>{
      const itens = state.lancamentos.filter(l=> l.cartaoId===cartao.id && l.competenciaFatura===mesKeyRef);
      if(!itens.length || itens.every(l=>l.efetivado)) return;
      const [cy,cm] = mesKeyRef.split("-").map(Number);
      const mesRef = new Date(cy, cm-1, 1);
      const vencimento = new Date(mesRef.getFullYear(), mesRef.getMonth(), cartao.diaVencimento);
      const vencStr = vencimento.toISOString().slice(0,10);
      if(vencStr<=daqui3dias) faturasPendentes.push({data:vencStr, cartao, mesKeyRef, total: itens.reduce((s,l)=>s+(l.tipo==="despesa"?l.valor:-l.valor),0)});
    });
  });
  faturasPendentes.sort((a,b)=> a.data.localeCompare(b.data));
  return {hojeStr, despesasPendentes, entradasPendentes, transferenciasPendentes, faturasPendentes};
}
function totalAlertasGlobais(){
  const a = computarAlertasGlobais();
  return a.despesasPendentes.length + a.entradasPendentes.length + a.transferenciasPendentes.length + a.faturasPendentes.length;
}

function sparklineSvg(valores, w, h, cor){
  if(valores.length<2) return "";
  const min = Math.min(...valores), max = Math.max(...valores);
  const range = (max-min) || 1;
  const step = w/(valores.length-1);
  const pts = valores.map((v,i)=> [i*step, h - ((v-min)/range)*h*0.85 - h*0.05]);
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaPath = path + ` L${w},${h} L0,${h} Z`;
  const gradId = "sparkgrad"+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible;">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cor}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${cor}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
    <path d="${path}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function fluxoCaixaChartSvg(dias, w, h){
  const padL = 46, padR = 8, padT = 12, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const allVals = dias.flatMap(d=>[d.entradas, d.saidas, d.saldo]);
  let min = Math.min(0, ...allVals), max = Math.max(0, ...allVals);
  if(min===max){ min-=100; max+=100; }
  const range = (max-min) || 1;
  const n = dias.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const yFor = (v)=> padT + plotH - ((v-min)/range)*plotH;
  const xFor = (i)=> padL + i*stepX;
  const smoothPathFor = (key)=>{
    const pts = dias.map((d,i)=> [xFor(i), yFor(d[key])]);
    if(pts.length<2) return "";
    let path = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
      const cx = (x0+x1)/2;
      path += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
    }
    return path;
  };
  const marcaCada = Math.max(1, Math.ceil(n/6));
  const dotsFor = (key, cor)=> dias.map((d,i)=> (i%marcaCada===0 || i===n-1) ? `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(d[key]).toFixed(1)}" r="2.5" fill="var(--surface)" stroke="${cor}" stroke-width="1.8"/>` : "").join("");
  const gridLines = [max, 0, min].filter((v,i,a)=>a.indexOf(v)===i).map(v=>{
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${v===0?'3,3':'0'}" opacity="${v===0?'0.8':'0.4'}"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--gray-400)">${fmtMoneyShort(v)}</text>`;
  }).join("");
  const passoLabel = Math.max(1, Math.ceil(n/6));
  const xLabels = dias.map((d,i)=>{
    if(i%passoLabel!==0 && i!==n-1) return "";
    return `<text x="${xFor(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9.5" fill="var(--gray-400)">${d.label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;">
    ${gridLines}
    <path d="${smoothPathFor('entradas')}" fill="none" stroke="var(--type-entrada)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${smoothPathFor('saidas')}" fill="none" stroke="var(--type-despesa)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${smoothPathFor('saldo')}" fill="none" stroke="var(--type-investimento)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dotsFor('entradas','var(--type-entrada)')}
    ${dotsFor('saidas','var(--type-despesa)')}
    ${dotsFor('saldo','var(--type-investimento)')}
    ${xLabels}
  </svg>`;
}
function fmtMoneyShort(v){
  const abs = Math.abs(v);
  if(abs>=1000) return (v<0?'-':'')+'R$ '+(abs/1000).toFixed(abs%1000===0?0:1).replace('.',',')+'k';
  return 'R$ '+v.toFixed(0);
}
function historicoConsumoChartSvg(meses, w, h, cor){

  for(let i=0;i<pts.length-1;i++){

    const cx = (x0+x1)/2;
    path += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const dots = meses.map((m,i)=> `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(m.valor).toFixed(1)}" r="2.5" fill="var(--surface)" stroke="${cor}" stroke-width="1.8"/>`).join("");
  const gridLine = `<line x1="${padL}" y1="${yFor(max).toFixed(1)}" x2="${w-padR}" y2="${yFor(max).toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.4"/>
    <text x="${padL-6}" y="${(yFor(max)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--gray-400)">${fmtMoneyShort(max)}</text>`;
  const xLabels = meses.map((m,i)=> `<text x="${xFor(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--gray-400)">${m.label}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;">
    ${gridLine}
    <path d="${path}" fill="none" stroke="${cor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
