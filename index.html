      </div>
      ${(()=>{
        const todosLancsRaw = state.lancamentos.filter(l=> l.tipo==="entrada" || l.tipo==="despesa");
        // agrupa parcelamentos (recorrencia.tipo==="parcelado") pelo grupoId, mantendo so a primeira parcela, com o valor total do grupo
        const jaVistoGrupo = new Set();
        const todosLancs = [];
        for(const l of [...todosLancsRaw].sort((a,b)=> (a.recorrencia.parcelaAtual||0)-(b.recorrencia.parcelaAtual||0))){
          const isParcelado = l.recorrencia && l.recorrencia.ativa && l.recorrencia.tipo==="parcelado" && l.recorrencia.grupoId;
          if(isParcelado){
            if(jaVistoGrupo.has(l.recorrencia.grupoId)) continue;
            jaVistoGrupo.add(l.recorrencia.grupoId);
            const parcelas = todosLancsRaw.filter(x=> x.recorrencia && x.recorrencia.grupoId===l.recorrencia.grupoId);
            const primeira = parcelas.reduce((min,x)=> (x.recorrencia.parcelaAtual||0) < (min.recorrencia.parcelaAtual||0) ? x : min, parcelas[0]);
            const valorTotalGrupo = parcelas.reduce((s,x)=> s+x.valor, 0);
            todosLancs.push(Object.assign({}, primeira, {_valorExibicao: valorTotalGrupo, _isParceladoAgrupado: true}));
          } else {
            todosLancs.push(Object.assign({}, l, {_valorExibicao: l.valor}));
          }
        }
        todosLancs.sort((a,b)=> (b.criadoEm||"").localeCompare(a.criadoEm||"") || b.data.localeCompare(a.data) || (b.hora||"").localeCompare(a.hora||""));
        const filtrados = dashTransacoesTab==="todas" ? todosLancs : dashTransacoesTab==="entrada" ? todosLancs.filter(l=>l.tipo==="entrada") : todosLancs.filter(l=>l.tipo==="despesa");
        const ultimasN = filtrados.slice(0,5);
        if(!ultimasN.length) return emptyState("Nenhuma transação encontrada.");
        return ultimasN.map(l=>{
          const cat = l.categoriasIds[0] ? categoriaById(l.categoriasIds[0]) : null;
          const subcat = l.categoriasIds[1] ? categoriaById(l.categoriasIds[1]) : null;
          const isMultiCat = Array.isArray(l.categoriasSplits) && l.categoriasSplits.length>1;
          const nomeExibido = l._isParceladoAgrupado ? (l.nome||"").replace(/\s*\(\d+\/\d+\)\s*$/,"") : l.nome;
          return `<div class="dash-row" data-abre-transacao="${l.id}" style="padding:6px 4px;">
            <div class="dash-row-main">
              ${isMultiCat ? `<span class="cat-circle" style="background:#4A473E;color:#fff;">${ICONS.splitCat}</span>` : (subcat ? catCircleHtmlSubcat(subcat) : (cat ? catCircleHtml(cat) : `<span class="cat-circle" style="background:var(--gray-100);color:var(--gray-400);">${ICONS.detail}</span>`))}
              <div style="min-width:0;">
                <div class="dash-row-name" style="font-size:12.5px;">${nomeExibido}${l._isParceladoAgrupado?` <span class="mini-note" style="margin:0;font-weight:400;">(total parcelado)</span>`:''}</div>
                <div class="mini-note" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${isMultiCat ? "Multicategoria" : (subcat&&cat ? `${cat.nome} › ${subcat.nome}` : (cat ? cat.nome : "Sem categoria"))}</div>
              </div>
            </div>
            <div class="dash-row-vals">
              <div class="val ${l.tipo==='despesa'?'neg':'pos'}" style="font-size:14px;margin-top:0;">${l.tipo==='despesa'?'- ':''}${fmtMoney(l._valorExibicao)}</div>
              <div class="dash-row-previsto">${fmtDate((l.criadoEm||l.data).slice(0,10))}</div>
            </div>
            <span class="tt-icon" style="color:var(--gray-400);width:16px;height:16px;flex:none;">${ICONS.chevronRight||'›'}</span>
          </div>`;
        }).join("");
      })()}
    </div>

    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div>
          <h3 style="margin:0;line-height:1.15;">Fluxo de caixa</h3>
          <p class="mini-note" style="margin:4px 0 20px;line-height:1.2;">Evolução das transações</p>
        </div>
        <div class="pill-select" style="flex:none;">
          ${["7D","30D","3M","6M","12M"].map(p=>`<button type="button" class="pill-tipo-btn-sm ${fluxoCaixaPeriodo===p?'active-neutral':''}" data-fluxo-periodo="${p}">${p}</button>`).join("")}
        </div>
      </div>
      ${(()=>{
        const ultimoDiaNum = Number(ultimoDiaMes(currentMonth).slice(8,10));
        const diasMap = {"7D":7, "30D":ultimoDiaNum, "3M":90, "6M":180, "12M":365};
        const qtdDias = diasMap[fluxoCaixaPeriodo] || 30;
        const fimRef = fluxoCaixaPeriodo==="30D" ? new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 0) : new Date();
        const inicioRef = new Date(fimRef); inicioRef.setDate(inicioRef.getDate()-(qtdDias-1));
        const agruparPorSemana = fluxoCaixaPeriodo!=="7D";
        const baldeSize = agruparPorSemana ? 7 : 1;
        const pontos = [];
        let saldoAcum = 0;
        for(let start=0; start<qtdDias; start+=baldeSize){
          const dIni = new Date(inicioRef); dIni.setDate(dIni.getDate()+start);
          const dFim = new Date(dIni); dFim.setDate(dFim.getDate()+Math.min(baldeSize, qtdDias-start)-1);
          const dIniStr = dIni.toISOString().slice(0,10), dFimStr = dFim.toISOString().slice(0,10);
          const lancsBalde = state.lancamentos.filter(l=>{
            const dStr = l.efetivado?(l.dataEfetivacao||l.data).slice(0,10):l.data;
            return dStr>=dIniStr && dStr<=dFimStr;
          });
          const entradas = lancsBalde.filter(l=>l.tipo==="entrada").reduce((s,l)=>s+l.valor,0);
          const saidas = lancsBalde.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+l.valor,0);
          saldoAcum += entradas - saidas;
          const label = agruparPorSemana
            ? String(dIni.getDate()).padStart(2,"0")+"/"+String(dIni.getMonth()+1).padStart(2,"0")
            : String(dIni.getDate()).padStart(2,"0")+"/"+String(dIni.getMonth()+1).padStart(2,"0");
          pontos.push({label, entradas, saidas, saldo: saldoAcum});
        }
        return fluxoCaixaChartSvg(pontos, 480, 204);
      })()}
      <div style="display:flex;align-items:center;justify-content:center;margin-top:14px;gap:14px;font-size:11px;font-weight:600;">
        <span style="display:flex;align-items:center;gap:5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:50%;background:var(--type-entrada);display:inline-block;"></span>Entradas</span>
        <span style="display:flex;align-items:center;gap:5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:50%;background:var(--type-despesa);display:inline-block;"></span>Saídas</span>
        <span style="display:flex;align-items:center;gap:5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:50%;background:var(--type-investimento);display:inline-block;"></span>Saldo</span>
      </div>
    </div>
    </div>
  `;
  root.querySelectorAll("[data-ir-meta]").forEach(el=> el.addEventListener("click", ()=>{ currentView="metas"; renderNav(); renderView(); renderMonthLabel(); }));
  root.querySelectorAll("[data-fluxo-periodo]").forEach(b=> b.addEventListener("click", ()=>{ fluxoCaixaPeriodo = b.dataset.fluxoPeriodo; renderDashboard(root); }));
  root.querySelectorAll("[data-dash-orc-tab]").forEach(b=> b.addEventListener("click", ()=>{ dashOrcTab = b.dataset.dashOrcTab; renderDashboard(root); }));
  const nodeSaldoPrevisto = document.getElementById("nodeSaldoPrevisto");
  if(nodeSaldoPrevisto) nodeSaldoPrevisto.onclick = ()=> openDetalheSaldoPrevistoModal();
  root.querySelectorAll("[data-kpi-extrato]").forEach(el=> el.addEventListener("click", ()=> openExtratoKpiModal(el.dataset.kpiExtrato)));
  root.querySelectorAll("[data-donut-idx]").forEach(el=> el.addEventListener("click", ()=>{
    const idx = Number(el.dataset.donutIdx);
    donutSelecionado = donutSelecionado===idx ? null : idx;
    renderDashboard(root);
  }));
  root.querySelectorAll("[data-cat-extrato]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    openExtratoKpiModal("despesa", el.dataset.catExtrato);
  }));
  root.querySelectorAll("[data-cat-nome]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const catId = el.dataset.catNome;
    if(!donutCategoriaAtiva && catFilhas(catId).length>0){
      donutCategoriaAtiva = catId;
      donutSelecionado = null;
      renderDashboard(root);
    } else {
      openExtratoKpiModal("despesa", catId);
    }
  }));
  const btnDonutVoltar = document.getElementById("btnDonutVoltar");
  if(btnDonutVoltar) btnDonutVoltar.onclick = (e)=>{
    e.stopPropagation();
    donutCategoriaAtiva = null;
    donutSelecionado = null;
    renderDashboard(root);
  };
  root.querySelectorAll("[data-orc-cat-extrato]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    openExtratoKpiModal(dashOrcTab, el.dataset.orcCatExtrato);
  }));
  root.querySelectorAll("[data-extrato-conta]").forEach(row=> row.addEventListener("click", (e)=>{
    if(e.target.closest(".dash-detail-btn")) return;
    openExtratoContaModal(row.dataset.extratoConta);
  }));
  const btnVerTodasContas = document.getElementById("btnVerTodasContas");
  if(btnVerTodasContas) btnVerTodasContas.onclick = ()=>{ currentView="contas"; renderNav(); renderView(); renderMonthLabel(); };
  const btnVerTodosCartoes = document.getElementById("btnVerTodosCartoes");
  if(btnVerTodosCartoes) btnVerTodosCartoes.onclick = ()=>{ currentView="cartoes"; renderNav(); renderView(); renderMonthLabel(); };
  root.querySelectorAll("[data-transacoes-tab]").forEach(b=> b.onclick = ()=>{ dashTransacoesTab = b.dataset.transacoesTab; renderDashboard(root); });
  root.querySelectorAll("[data-abre-transacao]").forEach(row=> row.addEventListener("click", ()=> openLancamentoModal(row.dataset.abreTransacao)));
  const btnVerTodasTransacoes = document.getElementById("btnVerTodasTransacoes");
  const btnVerTodasTransacoesRodape = document.getElementById("btnVerTodasTransacoesRodape");
  const irParaLancamentos = ()=>{ currentView="lancamentos"; renderNav(); renderView(); renderMonthLabel(); };
  if(btnVerTodasTransacoes) btnVerTodasTransacoes.onclick = irParaLancamentos;
  if(btnVerTodasTransacoesRodape) btnVerTodasTransacoesRodape.onclick = irParaLancamentos;
  root.querySelectorAll("[data-extrato-cartao]").forEach(row=> row.addEventListener("click", (e)=>{
    if(e.target.closest(".dash-detail-btn")) return;
    openExtratoFaturaModal(row.dataset.extratoCartao, row.dataset.mes);
  }));
  root.querySelectorAll("[data-detail-conta]").forEach(b=> b.addEventListener("click", (e)=>{ e.stopPropagation(); openContaModal(b.dataset.detailConta); }));
  root.querySelectorAll("[data-detail-cartao]").forEach(b=> b.addEventListener("click", (e)=>{ e.stopPropagation(); openCartaoModal(b.dataset.detailCartao); }));
}

function emptyState(msg){
  return `<div class="empty-state">${ICONS.empty}<div>${msg}</div></div>`;
}

let lancFiltro = {tipo:"todos", contaId:"", categoriaId:"", ocultarEfetivados:false};
let lancBusca = "";
let lancPageSize = 10;
let lancPage = 1;
function paginationControlsHtml(totalCount, page, pageSize, prefix){
  const totalPages = Math.max(1, Math.ceil(totalCount/pageSize));
  return `<div class="table-toolbar" style="justify-content:space-between;border-top:1px solid var(--line);">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="mini-note" style="margin:0;">Itens por página:</span>
      <select id="${prefix}PageSize" style="width:auto;padding:4px 8px;">
        <option value="10" ${pageSize===10?'selected':''}>10</option>
        <option value="25" ${pageSize===25?'selected':''}>25</option>
        <option value="50" ${pageSize===50?'selected':''}>50</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="icon-btn" id="${prefix}PagePrev" ${page<=1?'disabled':''}>${ICONS.chevronLeft||'‹'}</button>
      <span class="mini-note" style="margin:0;">Página ${page} de ${totalPages}</span>
      <button class="icon-btn" id="${prefix}PageNext" ${page>=totalPages?'disabled':''}>${ICONS.chevronRight||'›'}</button>
    </div>

function buildInvestimentoRows(monthDate){
  const rows = [];
  state.investimentos.ativos.forEach(ativo=>{
    state.investimentos.aportes.filter(a=>a.ativoId===ativo.id && isInMonth(a.data, monthDate)).forEach(a=>{
      rows.push({ id:a.id, kind:"aporte", ativoId:ativo.id, ativoNome:ativo.nome, tipo:a.tipo, data:a.data,
        valor: a.tipo==="resgate" ? -a.valor : a.valor, categoriaId:a.categoriaId||ativo.categoriaId, contaId:a.contaId, efetivado:a.efetivado });
    });
    const upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativo.id).sort((a,b)=>a.data.localeCompare(b.data));
    upds.forEach(u=>{
      if(isInMonth(u.data, monthDate)){
        const baseAntes = baseAntesAtualizacao(ativo.id, u);
        rows.push({ id:u.id, kind:"rendimento", ativoId:ativo.id, ativoNome:ativo.nome, tipo:"rendimento", data:u.data,
          valor: u.valorAtual-baseAntes, categoriaId:ativo.categoriaId, contaId:ativo.contaId, efetivado:true });
      }
    });
  });
  return rows;
}
function contaCartaoCellHtml(l){
  if(l.cartaoId){
    const cartao = cartaoById(l.cartaoId);
    if(!cartao) return "—";
    return `<div class="mini-note" style="margin-bottom:2px;">Cartão de Crédito</div><div style="display:flex;align-items:center;">${entityCircleHtml(cartao.cor,cartao.icone)}${cartao.nome}</div>`;
  }
  const conta = contaById(l.contaId);
  if(!conta) return "—";
  const tipoLabel = {corrente:"Conta Corrente",poupanca:"Poupança",carteira:"Carteira",investimento:"Investimento"}[conta.tipo]||conta.tipo;
  return `<div class="mini-note" style="margin-bottom:2px;text-transform:capitalize;">${tipoLabel}</div><div style="display:flex;align-items:center;">${entityCircleHtml(conta.cor,conta.icone)}${conta.nome}</div>`;
}
function renderLancamentos(root){
  const isInvestTab = lancFiltro.tipo==="investimento";
  let itens = [], investRows = [];
  if(isInvestTab){
    investRows = buildInvestimentoRows(currentMonth);
    if(lancFiltro.contaId) investRows = investRows.filter(r=>r.contaId===lancFiltro.contaId);
    if(lancFiltro.categoriaId) investRows = investRows.filter(r=>r.categoriaId===lancFiltro.categoriaId);
    sortByData(investRows);
  } else {
    itens = lancamentosDoMes(currentMonth).filter(l=> lancFiltro.tipo==="todos" ? l.tipo!=="investimento" : l.tipo===lancFiltro.tipo);
    if(lancFiltro.contaId) itens = itens.filter(l=>l.contaId===lancFiltro.contaId || l.contaDestinoId===lancFiltro.contaId);
    if(lancFiltro.categoriaId) itens = itens.filter(l=>l.categoriasIds.includes(lancFiltro.categoriaId));
    if(lancFiltro.ocultarEfetivados) itens = itens.filter(l=>!l.efetivado);
    if(lancBusca.trim()) itens = itens.filter(l=> (l.nome||"").toLowerCase().includes(lancBusca.trim().toLowerCase()));
    itens = sortByData(itens.slice());
  }
  const totalGeralFiltro = isInvestTab ? 0 : itens.reduce((s,l)=>s+(l.tipo==="despesa"?-l.valor:l.valor),0);
  const totalPendenteFiltro = isInvestTab ? 0 : itens.filter(l=>!l.efetivado).reduce((s,l)=>s+l.valor,0);
  const qtdPendenteFiltro = isInvestTab ? 0 : itens.filter(l=>!l.efetivado).length;
  const totalCount = isInvestTab ? investRows.length : itens.length;
  const totalPaginas = Math.max(1, Math.ceil(totalCount/lancPageSize));
  if(lancPage>totalPaginas) lancPage = totalPaginas;
  const inicioPag = (lancPage-1)*lancPageSize;
  if(isInvestTab) investRows = investRows.slice(inicioPag, inicioPag+lancPageSize);
  else itens = itens.slice(inicioPag, inicioPag+lancPageSize);

  const tabs = [
    {tipo:"todos", label:"Todos", icon:"dashboard"},
    {tipo:"entrada", label:"Entradas", icon:"kpiArrowDown"},
    {tipo:"despesa", label:"Despesas", icon:"kpiArrowUp"},
    {tipo:"transferencia", label:"Transferências", icon:"repeat"},
    {tipo:"investimento", label:"Investimentos", icon:"kpiChart"},
  ];
  const isTransf = lancFiltro.tipo==="transferencia";
  const isTodos = lancFiltro.tipo==="todos";
  const catFiltroAtual = lancFiltro.categoriaId ? categoriaById(lancFiltro.categoriaId) : null;

  root.innerHTML = `
    <div class="tabs-card">
      ${tabs.map(t=>`<button class="tab-btn tab-${t.tipo} ${lancFiltro.tipo===t.tipo?'active':''}" data-tab="${t.tipo}"><span class="tt-icon">${ICONS[t.icon]}</span>${t.label}</button>`).join("")}
    </div>
    <div class="table-wrap">
      <div class="table-toolbar" style="justify-content:space-between;">
        <div class="search-box" style="display:flex;align-items:center;gap:6px;flex:1;max-width:280px;padding:6px 8px;">
          <span class="tt-icon" style="color:var(--gray-400);flex:none;width:13px;height:13px;">${ICONS.search}</span>
          <input type="text" id="fBuscaLanc" placeholder="Buscar por nome..." value="${lancBusca}" style="border:none;background:transparent;padding:3px 0;width:100%;outline:none;font-size:12.5px;">
          ${lancBusca ? `<button type="button" id="btnLimparBuscaLanc" class="tt-icon" style="color:var(--gray-400);flex:none;width:13px;height:13px;cursor:pointer;background:none;border:none;padding:0;">${ICONS.close||'✕'}</button>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
        <span class="mini-note" style="margin:0;">Filtrar por:</span>
        <button class="btn ghost small" id="btnFiltroConta" style="display:flex;align-items:center;gap:6px;">
          <span class="tt-icon">${ICONS.contas}</span> Contas${lancFiltro.contaId?': '+(contaById(lancFiltro.contaId)?.nome||''):''}
        </button>
        ${!isTransf ? `<button class="btn ghost small" id="btnFiltroCategoria" style="display:flex;align-items:center;gap:6px;">
          <span class="tt-icon">${ICONS.categorias}</span> Categorias${catFiltroAtual?': '+catFiltroAtual.nome:''}
        </button>` : ""}
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="mini-note" style="margin:0;">Ocultar efetivados</span>
          <span class="switch ${lancFiltro.ocultarEfetivados?'on':''}" id="btnFiltroEfetivado"><span class="knob"></span></span>
        </div>
        </div>
      </div>
      <div class="table-scroll">
      <table class="tbl-compact-lanc">
        <thead><tr><th></th><th>Data/Hora</th><th>Nome</th>${!isTransf?'<th>Categoria</th>':''}<th>Conta/Cartão</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>
        ${isInvestTab ? (investRows.length ? investRows.map(r=>{
          const cat = r.categoriaId ? categoriaById(r.categoriaId) : null;
          const conta = r.contaId ? contaById(r.contaId) : null;
          const label = r.kind==="rendimento" ? "Rendimento" : (r.tipo==="resgate"?"Resgate":"Aporte");
          return `<tr class="ativo-row" data-id="${r.ativoId}" style="cursor:pointer;">
            <td onclick="event.stopPropagation()"><span class="efetivar-dot ${r.efetivado?'on':''} disabled" title="Investimentos são efetivados no próprio registro"></span></td>
            <td>${fmtDate(r.data)}</td>
            <td>${r.ativoNome} <span class="chip investimento">${label}</span></td>
            <td>${cat?catCircleHtml(cat)+cat.nome:"—"}</td>
            <td>${conta?`${entityCircleHtml(conta.cor,conta.icone)}${conta.nome}`:"—"}</td>
            <td style="text-align:right" class="${r.valor<0?'neg':'pos'} valor-destaque">${r.valor<0?'-':'+'}${fmtMoney(Math.abs(r.valor))}</td>
            <td></td>
          </tr>`;
        }).join("") : `<tr><td colspan="7">${emptyState("Nenhuma movimentação de investimento neste mês.")}</td></tr>`)
        : (itens.length ? itens.map(l=>{
          const conta = contaById(l.contaId);
          const destino = contaById(l.contaDestinoId);
          const sinal = l.tipo==="despesa"||l.tipo==="investimento" ? "-" : l.tipo==="entrada" ? "+" : "";
          const cor = l.tipo==="entrada"?"pos":(l.tipo==="despesa"||l.tipo==="investimento")?"neg":"";
          const catPai = l.categoriasIds[0] ? categoriaById(l.categoriasIds[0]) : null;
          const subcat = l.categoriasIds[1] ? categoriaById(l.categoriasIds[1]) : null;
          const cartaoLanc = l.cartaoId ? cartaoById(l.cartaoId) : null;
          return `<tr data-id="${l.id}" class="lanc-row ${cartaoLanc?(l.efetivado?'cartao-pago':'cartao-pendente'):''}" style="cursor:pointer;">

            ${!isTransf ? `
            <td>${Array.isArray(l.categoriasSplits)&&l.categoriasSplits.length>1 ? `<span class="cat-circle" style="background:#4A473E;color:#fff;">${ICONS.splitCat}</span>Multicategoria` : (subcat?`${catCircleHtmlSubcat(subcat)}${catPai?catPai.nome:''} › ${subcat.nome}`:(catPai?catCircleHtml(catPai)+catPai.nome:"—"))}</td>` : ""}
            <td>${l.tipo==="transferencia" ? `<span style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">${conta?entityCircleHtml(conta.cor,conta.icone):''}<span>${conta?conta.nome:"?"}</span><span class="tt-icon" style="display:inline-flex;color:var(--gray-400);">${ICONS.swap}</span>${destino?entityCircleHtml(destino.cor,destino.icone):''}<span>${destino?destino.nome:"?"}</span></span>` : contaCartaoCellHtml(l)}</td>
            <td style="text-align:right" class="${cor} valor-destaque">${sinal}${fmtMoney(l.valor)}</td>

              <button class="icon-btn dup-lanc" data-id="${l.id}" title="Duplicar">${ICONS.duplicate}</button>

        }).join("") : `<tr><td colspan="${isTransf?6:7}">${emptyState("Nenhum lançamento neste mês. Clique no botão “+” para começar.")}</td></tr>`)}
        </tbody>
        ${!isInvestTab && !isTransf && (itens.length || totalCount>0) ? `<tfoot><tr style="font-weight:700;border-top:2px solid var(--line);">
          <td></td><td></td><td>Total</td>${!isTransf?'<td></td>':''}<td></td>
          <td style="text-align:right" class="${totalGeralFiltro<0?'neg':'pos'} valor-destaque">${fmtMoney(totalGeralFiltro)}</td>

async function excluirLancamentoComOpcoes(l){
  if(!l.recorrencia.ativa){
    const ok = await openConfirmPortal("Deseja excluir este lançamento? Essa ação não pode ser desfeita.", {danger:true});
    if(!ok) return false;
    state.lancamentos = state.lancamentos.filter(x=>x.id!==l.id);
    await persist(true);
    return true;
  }
  const escolha = await new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "portal-overlay";
    overlay.innerHTML = `
      <div class="portal-modal" style="max-width:420px;">
        <div class="portal-head"><h2>Excluir lançamento recorrente</h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          <p class="mini-note" style="margin-bottom:14px;">Este lançamento faz parte de uma série. O que deseja excluir?</p>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="uma">Somente esta ocorrência</button>
            <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="futuras">Esta e as futuras</button>
            <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="todas">Todas as ocorrências da série</button>
          </div>
        </div>
        <div class="portal-foot"><div></div><button class="btn ghost" id="btnCancelOpt">Cancelar</button></div>
      </div>`;
    document.body.appendChild(overlay);
    function close(v){ overlay.remove(); resolve(v); }
    overlay.querySelector(".close-x").onclick = ()=>close(null);
    overlay.querySelector("#btnCancelOpt").onclick = ()=>close(null);
    overlay.querySelectorAll("[data-opt]").forEach(b=> b.onclick = ()=>close(b.dataset.opt));
    overlay.addEventListener("click", e=>{ if(e.target===overlay) close(null); });
  });
  if(!escolha) return false;
  const ok = await openConfirmPortal("Confirma a exclusão? Essa ação não pode ser desfeita.", {danger:true});
  if(!ok) return false;
  if(escolha==="uma"){
    state.lancamentos = state.lancamentos.filter(x=>x.id!==l.id);
  } else if(escolha==="futuras"){
    state.lancamentos = state.lancamentos.filter(x=> !(x.recorrencia.grupoId===l.recorrencia.grupoId && x.data>=l.data));
  } else {
    state.lancamentos = state.lancamentos.filter(x=> x.recorrencia.grupoId!==l.recorrencia.grupoId);
  }
  await persist(true);
  return true;
}

    }
    const fDataEl = overlay.querySelector("#fData");
    if(fDataEl) fDataEl.onchange = (e)=>{
      syncFromDom();
      if(form.cartaoId){
        form.efetivado = false;
      } else {
        form.efetivado = e.target.value <= todayStr();
        if(form.efetivado && !form.dataEfetivacao) form.dataEfetivacao = nowLocalIso();
      }
      draw();
    };
    const fEfetivadoEl = overlay.querySelector("#fEfetivado");
    if(fEfetivadoEl) fEfetivadoEl.onclick = ()=>{
      syncFromDom();
      form.efetivado = !form.efetivado;
      efetivadoTocadoManualmente = true;
      if(form.efetivado) form.dataEfetivacao = nowLocalIso();
      draw();
    };
    if(editing){
      const delBtn = overlay.querySelector("#btnDelInModal");
      if(delBtn) delBtn.onclick = async ()=>{
        const l = state.lancamentos.find(x=>x.id===id);
        const excluiu = await excluirLancamentoComOpcoes(l);
        if(!excluiu) return;
        overlay.remove(); renderView(); showToast("Lançamento excluído.");
      };
    }
    overlay.querySelector("#btnSave").onclick = async ()=>{
      if(multiCatMode){
        overlay.querySelectorAll("[data-multicat-valor]").forEach(el=>{
          const idx = Number(el.dataset.multicatValor);
          if(multiCatSplits[idx]) multiCatSplits[idx].valor = moneyVal(el);
        });
      }
      form.valor = moneyVal(overlay.querySelector("#fValor"));
      form.data = overlay.querySelector("#fData").value || todayStr();
      form.hora = overlay.querySelector("#fHora").value || nowTimeStr();
      form.nome = overlay.querySelector("#fNomeLanc").value.trim();
      form.descricao = overlay.querySelector("#fDesc").value.trim();
      const deEl = overlay.querySelector("#fDataEfet"); const heEl = overlay.querySelector("#fHoraEfet");
      if(form.efetivado && deEl && heEl) form.dataEfetivacao = deEl.value+"T"+(heEl.value||"00:00");
      const dcEl = overlay.querySelector("#fDataCriacao"); const hcEl = overlay.querySelector("#fHoraCriacao");
      if(dcEl && hcEl && dcEl.value){ form.criadoEm = dcEl.value+"T"+(hcEl.value||"00:00")+":00.000Z"; }
      if(!form.nome) form.nome = form.tipo==="transferencia" ? "Transferência" : "";

      function erro(labelId, msg){ focusFieldError(overlay, labelId, msg); }

      if(!overlay.querySelector("#fNomeLanc").value.trim() && form.tipo!=="transferencia"){ erro("lblNome","Informe um nome para o lançamento."); return; }
      if(!overlay.querySelector("#fData").value){ erro("lblData","Informe a data."); return; }
      if(!multiCatMode && !form.valor){ erro("lblValor","Informe um valor maior que zero."); return; }

      if(form.tipo==="transferencia"){
        form.contaId = overlay.querySelector("#fContaOrigem").value;
        form.contaDestinoId = overlay.querySelector("#fContaDestino").value;
        form.cartaoId = null; form.categoriasIds=[]; form.tagsIds=[];
        if(!form.contaId){ erro("lblContaOrigem","Selecione a conta de origem."); return; }
        if(!form.contaDestinoId){ erro("lblContaDestino","Selecione a conta de destino."); return; }
        if(form.contaId===form.contaDestinoId){ erro("lblContaDestino","Conta de origem e destino devem ser diferentes."); return; }
      } else {
        const fContaEl = overlay.querySelector("#fConta");
        if(fContaEl) form.contaId = fContaEl.value;
        if(!form.contaId){ erro("lblConta", form.tipo==='investimento'?"Cadastre uma conta de investimento primeiro.":"Selecione uma conta."); return; }
        const fCartaoEl = overlay.querySelector("#fCartao");
        form.cartaoId = fCartaoEl ? (fCartaoEl.value || null) : null;
        const fCompetenciaEl2 = overlay.querySelector("#fCompetencia");
        if(fCompetenciaEl2) form.competenciaFatura = fCompetenciaEl2.value;
        if(!form.cartaoId) form.competenciaFatura = null;
        form.contaDestinoId = null;
        if(multiCatMode){
          if(multiCatSplits.length<2){ showToast("Selecione ao menos 2 categorias para dividir o lançamento."); return; }
          if(multiCatSplits.some(s=>!s.categoriaId)){ showToast("Selecione a categoria em todas as linhas."); return; }
          if(multiCatSplits.some(s=>!s.subcategoriaId)){ showToast("Selecione a subcategoria em todas as linhas."); return; }
          if(multiCatSplits.every(s=>!s.valor)){ showToast("Informe o valor de pelo menos uma categoria."); return; }
        } else {
          if(!form.categoriasIds[0]){ erro("lblCategoria","Selecione a categoria."); return; }
          if(!form.categoriasIds[1]){ erro("lblSubcategoria","Selecione a subcategoria."); return; }
        }
      }
      const fTotalParcelasEl = overlay.querySelector("#fTotalParcelas");
      if(form.recorrencia.tipo==='parcelado' && fTotalParcelasEl){
        form.recorrencia.totalParcelas = Number(fTotalParcelasEl.value)||2;
      }

      if(multiCatMode){
        overlay.querySelectorAll("[data-multicat-valor]").forEach(el=>{
          const idx = Number(el.dataset.multicatValor);
          if(multiCatSplits[idx]) multiCatSplits[idx].valor = moneyVal(el);
        });
        form.categoriasSplits = multiCatSplits.map(s=> ({categoriaId:s.categoriaId, subcategoriaId:s.subcategoriaId, valor:Number(s.valor)||0}));
        form.categoriasIds = [];
        form.valor = form.categoriasSplits.reduce((s,x)=>s+(Number(x.valor)||0),0);
      } else {
        form.categoriasSplits = null;
      }

      // Aplica cálculo de parcelamento apenas na criação, ou quando a recorrência acaba de ser ativada
      // (nunca reprocessa um lançamento que já foi parcelado em uma edição anterior)
      const prevRecAntes = editing ? state.lancamentos.find(l=>l.id===id).recorrencia.ativa : false;
      let horizonteGeracao = 11;
      const deveProcessarParcelamento = form.recorrencia.ativa && form.recorrencia.tipo==="parcelado" && (!editing || !prevRecAntes || recorrenciaReiniciada);
      if(deveProcessarParcelamento){
        const total = form.recorrencia.totalParcelas||2;
        const inicial = form.recorrencia.parcelaInicial||1;
        if(form.recorrencia.valorTipo==="total"){
          form.valor = form.valor/total;
          if(Array.isArray(form.categoriasSplits) && form.categoriasSplits.length){
            form.categoriasSplits = form.categoriasSplits.map(s=> ({...s, valor: (Number(s.valor)||0)/total}));
          }
        }
        form.recorrencia.parcelaAtual = inicial;
        const nomeBaseSemSufixo = (form.nome||"").replace(/\s*\(\d+\/\d+\)\s*$/,"");
        form.nome = `${nomeBaseSemSufixo} (${inicial}/${total})`;
        horizonteGeracao = total-inicial;
      }

      if(editing){
        const idx = state.lancamentos.findIndex(l=>l.id===id);
        const prevRec = prevRecAntes;
        const grupoIdExistente = state.lancamentos[idx].recorrencia.grupoId;
        form.recorrencia.grupoId = grupoIdExistente || uid("rec");
        const fazPerguntaSerie = grupoIdExistente && !efetivadoTocadoManualmente && state.lancamentos.some(l=>l.id!==id && l.recorrencia.grupoId===grupoIdExistente);
        let aplicarATodos = false;
        if(fazPerguntaSerie){
          const escolha = await new Promise(resolve=>{
            const askOverlay = document.createElement("div");
            askOverlay.className = "portal-overlay";
            askOverlay.innerHTML = `
              <div class="portal-modal" style="max-width:420px;">
                <div class="portal-head"><h2>Lançamento recorrente</h2><button class="close-x">&times;</button></div>
                <div class="portal-body">
                  <p class="mini-note" style="margin-bottom:14px;">Este lançamento faz parte de uma série. Aplicar esta alteração em:</p>
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="uma">Somente esta ocorrência</button>
                    <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="todas">Todas as ocorrências da série</button>
                  </div>
                </div>
                <div class="portal-foot"><div></div><button class="btn ghost" id="btnCancelAsk">Cancelar</button></div>
              </div>`;
            document.body.appendChild(askOverlay);
            function close(v){ askOverlay.remove(); resolve(v); }
            askOverlay.querySelector(".close-x").onclick=()=>close(null);
            askOverlay.querySelector("#btnCancelAsk").onclick=()=>close(null);
            askOverlay.querySelectorAll("[data-opt]").forEach(b=> b.onclick=()=>close(b.dataset.opt));
            askOverlay.addEventListener("click", e=>{ if(e.target===askOverlay) close(null); });
          });
          if(!escolha) return;
          aplicarATodos = escolha==="todas";
        }
        state.lancamentos[idx] = Object.assign({}, form, {id});
        if(aplicarATodos){
          const novoTotal = form.recorrencia.totalParcelas;
          state.lancamentos.forEach(l=>{
            if(l.id===id || l.recorrencia.grupoId!==grupoIdExistente) return;
            const formNomeBase = (form.nome||"").replace(/\s*\(\d+\/\d+\)\s*$/,"");
            const tinhaSufixo = l.nome && /\(\d+\/\d+\)\s*$/.test(l.nome);
            const novoSufixo = (tinhaSufixo && novoTotal) ? `(${l.recorrencia.parcelaAtual}/${novoTotal})` : "";
            Object.assign(l, form, {
              id:l.id, data:l.data, hora:l.hora, efetivado:l.efetivado, dataEfetivacao:l.dataEfetivacao,
              competenciaFatura:l.competenciaFatura,
              nome: novoSufixo ? `${formNomeBase} ${novoSufixo}` : form.nome,
              recorrencia: Object.assign({}, form.recorrencia, {parcelaAtual:l.recorrencia.parcelaAtual})
            });
          });
          if(form.recorrencia.tipo==="parcelado" && novoTotal){
            const membrosSerie = state.lancamentos.filter(l=> l.recorrencia.grupoId===grupoIdExistente);
            const maxParcelaAtual = Math.max(...membrosSerie.map(l=> l.recorrencia.parcelaAtual||0));
            if(novoTotal > maxParcelaAtual){
              const ultimoMembro = membrosSerie.slice().sort((a,b)=> (b.recorrencia.parcelaAtual||0)-(a.recorrencia.parcelaAtual||0))[0];
              const faltantes = novoTotal - maxParcelaAtual;
              const baseParaGerar = Object.assign({}, ultimoMembro, {
                recorrencia: Object.assign({}, ultimoMembro.recorrencia, {totalParcelas:novoTotal})
              });
              const novos = gerarOcorrenciasRecorrencia(baseParaGerar, faltantes);
              state.lancamentos.push(...novos);
            } else if(novoTotal < maxParcelaAtual){
              state.lancamentos = state.lancamentos.filter(l=> !(l.recorrencia.grupoId===grupoIdExistente && (l.recorrencia.parcelaAtual||0) > novoTotal && !l.efetivado));
            }
          }
        }
        if(form.recorrencia.ativa && !prevRec){
          const novos = gerarOcorrenciasRecorrencia(state.lancamentos[idx], horizonteGeracao);
          state.lancamentos.push(...novos);
        }
        if(prevRec && !form.recorrencia.ativa && grupoIdExistente){
          const outrosDaSerie = state.lancamentos.filter(l=>l.id!==id && l.recorrencia.grupoId===grupoIdExistente);
          if(outrosDaSerie.length){
            const okRemover = await openConfirmPortal(`Este lançamento deixou de ser recorrente. Deseja também excluir as outras ${outrosDaSerie.length} ocorrências desta série?`, {danger:true, okLabel:"Excluir as outras"});
            if(okRemover){
              state.lancamentos = state.lancamentos.filter(l=> l.id===id || l.recorrencia.grupoId!==grupoIdExistente);
            }
          }
        }
      } else {
        form.id = uid("lanc");
        if(form.recorrencia.ativa) form.recorrencia.grupoId = uid("rec");
        state.lancamentos.push(form);
        if(form.recorrencia.ativa){
          const novos = gerarOcorrenciasRecorrencia(form, horizonteGeracao);
          state.lancamentos.push(...novos);
        }
      }
      if(form.tipo!=="transferencia" && form.categoriasIds[0]){
        state.configuracoes.lastUsedCategoria[form.tipo] = [form.categoriasIds[0], form.categoriasIds[1]||null];
      }
      if(form.cartaoId){
        state.configuracoes.lastUsedCartaoId = form.cartaoId;
      }
      await persist();
      overlay.remove();
      renderView();
      showToast("Lançamento salvo.");
    };
  }
  draw();
}

let mostrarContasArquivadas = false;
function renderContas(root){
  const contasAtivas = state.contas.filter(c=>!c.arquivada);
  const contasArquivadas = state.contas.filter(c=>c.arquivada);
  root.innerHTML = `
    <div class="view-header">
      <div></div>
      <button class="btn-create" id="btnNovaConta"><span class="badge-plus">${ICONS.plus}</span> Nova conta</button>
    </div>
    <div class="kpi-grid cols4-max">
      ${contasAtivas.length ? contasAtivas.map(c=>{
        const fimMesRef = ultimoDiaMes(currentMonth);
        const saldo = saldoContaAte(c.id, todayStr()<fimMesRef?todayStr():fimMesRef, true);
        const previsto = saldoPrevistoConta(c.id, currentMonth);
        return `<div class="card ${c.padrao?'ribbon-padrao':''}" data-extrato-conta="${c.id}" style="cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>${c.icone?`<span class="cat-circle" style="background:${c.cor};color:${contrastIconColor(c.cor)};">${CATEGORY_ICON_SVGS[c.icone]||''}</span>`:`<span class="rowcolor" style="background:${c.cor}"></span>`}<strong>${c.nome}</strong>${c.oculta?' <span class="mini-note" style="display:inline;">(oculta do dashboard)</span>':''}
            <div class="mini-note" style="text-transform:capitalize">${c.tipo} · ${c.moeda||'BRL'}${c.ativo?'':' · inativa'}</div></div>
            <div style="position:relative;" onclick="event.stopPropagation()">
              <button class="icon-btn kebab-btn" data-kebab-conta="${c.id}">${ICONS.kebab}</button>
            </div>
          </div>
          <div style="font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:12px;" class="${ehNegativo(saldo)?'neg':''}">${fmtMoneyIn(saldo, c.moeda)}</div>
          <div class="mini-note">Previsto: ${fmtMoneyIn(previsto, c.moeda)} · Saldo inicial: ${fmtMoneyIn(c.saldoInicial, c.moeda)}</div>
        </div>`;
      }).join("") : emptyState("Nenhuma conta cadastrada. Crie sua primeira conta para começar a lançar movimentações.")}
    </div>
    ${contasArquivadas.length ? `
    <div style="margin-top:20px;">
      <button class="btn ghost small" id="btnToggleArquivadas">${mostrarContasArquivadas?'Ocultar':'Ver'} ${contasArquivadas.length} conta(s) arquivada(s)</button>
      ${mostrarContasArquivadas ? `<div class="table-wrap" style="margin-top:10px;"><div class="table-scroll"><table>
        <thead><tr><th>Nome</th><th>Tipo</th><th></th></tr></thead>
        <tbody>${contasArquivadas.map(c=>`<tr><td>${catCircleHtml({cor:c.cor,icone:c.icone})}${c.nome}</td><td style="text-transform:capitalize;">${c.tipo}</td>
          <td><button class="btn small" data-restaurar-conta="${c.id}">Restaurar</button></td></tr>`).join("")}</tbody>
      </table></div></div>` : ""}
    </div>` : ""}
  `;
  document.getElementById("btnNovaConta").onclick = ()=> openContaModal(null);
  const btnToggleArq = document.getElementById("btnToggleArquivadas");
  if(btnToggleArq) btnToggleArq.onclick = ()=>{ mostrarContasArquivadas = !mostrarContasArquivadas; renderContas(root); };
  root.querySelectorAll("[data-restaurar-conta]").forEach(b=> b.onclick = async ()=>{
    const c = state.contas.find(x=>x.id===b.dataset.restaurarConta);
    c.arquivada = false;
    await persist(); renderContas(root); showToast("Conta restaurada.");
  });
  root.querySelectorAll("[data-extrato-conta]").forEach(card=> card.addEventListener("click", (e)=>{
    if(e.target.closest(".icon-btn")) return;
    openExtratoContaModal(card.dataset.extratoConta);
  }));
  root.querySelectorAll("[data-kebab-conta]").forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const cid = b.dataset.kebabConta;
    const conta = state.contas.find(x=>x.id===cid);
    openKebabMenu(b, [
      {label:"Ver extrato", onClick:()=> openExtratoContaModal(cid)},
      {label:"Editar", onClick:()=> openContaModal(cid)},
      {label:"Arquivar", onClick: async ()=>{
        const ok = await openConfirmPortal("Arquivar esta conta? Ela sai das telas principais, mas o histórico é mantido e você pode restaurá-la depois.");
        if(!ok) return;
        conta.arquivada = true;
        await persist(); renderContas(root); showToast("Conta arquivada.");
      }},
      {label:"Excluir definitivamente", danger:true, onClick: async ()=>{
        const usada = state.lancamentos.some(l=>l.contaId===cid || l.contaDestinoId===cid);
        const msg = usada ? "Esta conta possui lançamentos vinculados. Excluí-la pode afetar o histórico. Deseja continuar?" : "Deseja excluir esta conta?";
        const ok = await openConfirmPortal(msg, {danger:true});
        if(!ok) return;
        state.contas = state.contas.filter(c=>c.id!==cid);
        await persist(); renderContas(root); showToast("Conta excluída.");
      }},
    ]);
  });
}

function openContaModal(id){
  const editing = !!id;
  const base = editing ? state.contas.find(c=>c.id===id) : {id:null,nome:"",tipo:"corrente",saldoInicial:0,cor:"#173E37",moeda:"BRL",categoriaContaId:null,icone:"bank",oculta:false,ativo:true};
  const ACCOUNT_TYPE_ICON = {corrente:"bank", poupanca:"piggy", carteira:"wallet", investimento:"investment"};
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";
  overlay.innerHTML = `
    <div class="portal-modal">
      <div class="portal-head"><h2>${editing?"Editar conta":"Nova conta"}</h2><button class="close-x">&times;</button></div>
      <div class="portal-body">
        <div class="field-row" style="grid-template-columns:auto 1fr auto;align-items:flex-end;gap:14px;">
          <div class="field" style="align-items:center;">
            ${iconPickerHtml("fIcone", base.icone, Object.values(ACCOUNT_TYPE_ICON))}
          </div>
          <label class="field">Nome <input type="text" id="fNome" value="${base.nome}"></label>
          <div class="field" style="align-items:center;">
            <span style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Cor</span>
            ${colorPickerHtml("fCor", base.cor)}
          </div>
        </div>
        <div class="field-row">
          <label class="field">Tipo
            <select id="fTipo">
              <option value="corrente" ${base.tipo==='corrente'?'selected':''}>Conta corrente</option>
              <option value="poupanca" ${base.tipo==='poupanca'?'selected':''}>Poupança</option>
              <option value="carteira" ${base.tipo==='carteira'?'selected':''}>Carteira / dinheiro</option>
              <option value="investimento" ${base.tipo==='investimento'?'selected':''}>Conta investimento</option>
            </select>
          </label>
          <label class="field">Moeda principal
            <select id="fMoeda">
              <option value="BRL" ${base.moeda==='BRL'?'selected':''}>R$ — Real (BRL)</option>
              <option value="USD" ${base.moeda==='USD'?'selected':''}>US$ — Dólar (USD)</option>
              <option value="EUR" ${base.moeda==='EUR'?'selected':''}>€ — Euro (EUR)</option>
              <option value="GBP" ${base.moeda==='GBP'?'selected':''}>£ — Libra (GBP)</option>
              <option value="MXN" ${base.moeda==='MXN'?'selected':''}>MX$ — Peso mexicano (MXN)</option>
            </select>
          </label>
        </div>
        <label class="field">Saldo inicial <input id="fSaldo"></label>
        <div class="toggle-row" style="padding:10px 0 0;">
          <div class="ti">
            <h4>Ocultar esta conta da tela principal</h4>
            <p>Mesmo com saldo, ela não aparecerá no Dashboard. O histórico e o saldo continuam sendo calculados normalmente.</p>
          </div>
          ${toggleSwitchHtml("fOculta", base.oculta)}
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Definir como conta padrão</h4>
            <p>Usada como sugestão automática ao criar um novo lançamento.</p>
          </div>
          ${toggleSwitchHtml("fPadrao", base.padrao)}
        </div>
      </div>
      <div class="portal-foot">
        <div></div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Salvar</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  maskMoney(overlay.querySelector("#fSaldo"), base.saldoInicial);
  wireColorPicker(overlay, "fCor");
  wireIconPicker(overlay, "fIcone");
  let ocultaVal = base.oculta;
  let padraoVal = base.padrao;
  overlay.querySelector("#fOculta").onclick = (e)=>{ ocultaVal = !ocultaVal; e.currentTarget.classList.toggle("on", ocultaVal); };
  overlay.querySelector("#fPadrao").onclick = (e)=>{ padraoVal = !padraoVal; e.currentTarget.classList.toggle("on", padraoVal); };
  const fTipoEl = overlay.querySelector("#fTipo");
  fTipoEl.onchange = ()=>{
    if(editing) return;
    const ic = ACCOUNT_TYPE_ICON[fTipoEl.value] || "bank";
    const input = overlay.querySelector("#fIcone");
    const trigger = overlay.querySelector("#fIcone_trigger");
    input.value = ic;
    trigger.innerHTML = CATEGORY_ICON_SVGS[ic];
  };
  overlay.querySelector(".close-x").onclick=()=>overlay.remove();
  overlay.querySelector("#btnCancel").onclick=()=>overlay.remove();
  overlay.querySelector("#btnSave").onclick = async ()=>{
    const nome = overlay.querySelector("#fNome").value.trim();
    if(!nome){ showToast("Informe um nome."); return; }
    const data = {
      id: editing?id:uid("conta"),
      nome, tipo: overlay.querySelector("#fTipo").value,
      moeda: overlay.querySelector("#fMoeda").value,
      icone: overlay.querySelector("#fIcone").value || "bank",
      categoriaContaId: base.categoriaContaId || null,
      saldoInicial: moneyVal(overlay.querySelector("#fSaldo")),
      cor: overlay.querySelector("#fCor").value,
      oculta: ocultaVal,
      arquivada: base.arquivada||false,
      padrao: padraoVal,
      ativo:true
    };
    if(padraoVal){ state.contas.forEach(c=> c.padrao=false); }
    if(editing){ const idx=state.contas.findIndex(c=>c.id===id); state.contas[idx]=data; }
    else state.contas.push(data);
    await persist(); overlay.remove(); renderView(); showToast("Conta salva.");
  };
}

function openExtratoContaModal(contaId){
  const conta = contaById(contaId);
  if(!conta) return;
  let mesExtrato = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";

  function draw(){
    const itens = sortByData(state.lancamentos.filter(l=> (l.contaId===contaId || l.contaDestinoId===contaId) && isInMonthCompetencia(l, mesExtrato)));
    overlay.innerHTML = `
      <div class="portal-modal wide">
        <div class="portal-head"><h2 style="display:flex;align-items:center;gap:6px;"><strong>Extrato:</strong> <span style="display:flex;align-items:center;gap:3px;font-weight:400;">${entityCircleHtml(conta.cor,conta.icone)}${conta.nome}</span></h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;">
            <button class="icon-btn" id="btnMesExtratoPrev">${ICONS.chevronLeft||'‹'}</button>
            <strong style="font-family:var(--font-display);font-size:16px;">${fmtMonthLabel(mesExtrato)}</strong>
            <button class="icon-btn" id="btnMesExtratoNext">${ICONS.chevronRight||'›'}</button>
          </div>
          <div class="table-scroll">
          <table>
            <thead><tr><th></th><th>Data/Hora</th><th>Tipo</th><th>Nome</th><th style="text-align:right">Valor</th></tr></thead>
            <tbody>
            ${itens.length ? itens.map(l=>{
              const valorConta = signedValueForConta(l, contaId);
              const outra = l.tipo==="transferencia" ? contaById(l.contaId===contaId ? l.contaDestinoId : l.contaId) : null;
              const cartaoLanc = l.cartaoId ? cartaoById(l.cartaoId) : null;
              return `<tr class="lanc-row ${cartaoLanc?(l.efetivado?'cartao-pago':'cartao-pendente'):''}" data-id="${l.id}" style="cursor:pointer;">
                <td onclick="event.stopPropagation()"><span class="efetivar-dot ${l.efetivado?'on':''} ${l.cartaoId?'disabled':''}" ${l.cartaoId?'title="Controlado pelo pagamento da fatura"':`data-efetivar="${l.id}" title="Marcar como efetivado"`}>${ICONS.check}</span></td>
                <td>${fmtDateHora(l)}</td>
                <td><span class="chip ${l.tipo}">${l.tipo==='entrada'?'Entrada':l.tipo==='despesa'?'Despesa':'Transferência'}</span></td>
                <td>${l.nome||"—"}${cartaoLanc?` <span class="mini-note" style="display:inline;">(${cartaoLanc.nome})</span>`:""}${outra?` <span class="mini-note">(${l.contaId===contaId?'para':'de'} ${outra.nome})</span>`:""}</td>
                <td style="text-align:right;" class="${valorConta<0?'neg':'pos'}">${valorConta<0?'-':'+'}${fmtMoneyIn(Math.abs(valorConta), conta.moeda)}</td>
              </tr>`;
            }).join("") : `<tr><td colspan="5">${emptyState("Nenhum lançamento nesta conta neste mês.")}</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>
        <div class="portal-foot"><div></div><button class="btn ghost" id="btnFechar">Fechar</button></div>
      </div>`;
    overlay.querySelector(".close-x").onclick=()=>overlay.remove();
    overlay.querySelector("#btnFechar").onclick=()=>overlay.remove();
    overlay.querySelector("#btnMesExtratoPrev").onclick = ()=>{ mesExtrato = new Date(mesExtrato.getFullYear(), mesExtrato.getMonth()-1, 1); draw(); };
    overlay.querySelector("#btnMesExtratoNext").onclick = ()=>{ mesExtrato = new Date(mesExtrato.getFullYear(), mesExtrato.getMonth()+1, 1); draw(); };
    overlay.querySelectorAll(".lanc-row").forEach(tr=> tr.addEventListener("click", ()=>{ overlay.remove(); openLancamentoModal(tr.dataset.id); }));
    overlay.querySelectorAll("[data-efetivar]").forEach(dot=> dot.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const l = state.lancamentos.find(x=>x.id===dot.dataset.efetivar);
      l.efetivado = !l.efetivado;
      if(l.efetivado && !l.cartaoId) l.dataEfetivacao = nowLocalIso();
      await persist(); draw(); renderView();
    }));
    overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  }
  document.body.appendChild(overlay);
  draw();
}

function faturaPrecisaPagar(cartao){
  const hoje = new Date();
  if(hoje.getDate() < cartao.diaFechamento) return null; // fatura deste ciclo ainda aberta
  const compFechada = monthKey(hoje);
  const itens = state.lancamentos.filter(l=> l.cartaoId===cartao.id && (l.competenciaFatura||l.data.slice(0,7))===compFechada);
  if(!itens.length || !itens.some(l=>!l.efetivado)) return null;
  const mesVenc = cartao.diaVencimento < cartao.diaFechamento ? new Date(hoje.getFullYear(), hoje.getMonth()+1, cartao.diaVencimento) : new Date(hoje.getFullYear(), hoje.getMonth(), cartao.diaVencimento);
  return mesVenc;
}

function openPagarFaturaModal(cartao, itens, total, vencimento, onDone){
  const overlay = document.createElement("div");
  overlay.className = "portal-overlay";
  overlay.innerHTML = `
    <div class="portal-modal">
      <div class="portal-head"><h2 style="display:flex;align-items:center;gap:6px;"><strong>Pagar Fatura:</strong> <span style="display:flex;align-items:center;gap:3px;font-weight:400;">${entityCircleHtml(cartao.cor,cartao.icone)}${cartao.nome}</span></h2><button class="close-x">&times;</button></div>
      <div class="portal-body">
        <div class="field-row">
          <label class="field">Valor pago
            <input id="fValorPago">
          </label>
          <label class="field">Data do pagamento
            <input type="date" id="fDataPagamento" value="${todayStr()}">
          </label>
        </div>
        <p class="mini-note">Total da fatura: ${fmtMoney(total)}. Se você pagar menos que o total, o valor restante é transferido para a próxima fatura.</p>
      </div>
      <div class="portal-foot"><div></div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnConfirmarPagamento">Confirmar pagamento</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  maskMoney(overlay.querySelector("#fValorPago"), total);
  overlay.querySelector(".close-x").onclick = ()=>overlay.remove();
  overlay.querySelector("#btnCancel").onclick = ()=>overlay.remove();
  overlay.querySelector("#btnConfirmarPagamento").onclick = async ()=>{
    const valorPago = moneyVal(overlay.querySelector("#fValorPago"));
    const dataEscolhida = overlay.querySelector("#fDataPagamento").value || todayStr();
    const dataPagamento = dataEscolhida+"T00:00";
    const grupoPagamento = uid("pag");
    itens.forEach(l=>{ l.efetivado = true; l.dataEfetivacao = dataPagamento; l.grupoPagamento = grupoPagamento; });
    const restante = total - valorPago;
    if(restante > 0.004){
      const proxMes = new Date(vencimento.getFullYear(), vencimento.getMonth()+1, 1);
      state.lancamentos.push({
        id: uid("lanc"), tipo:"despesa", nome:"Saldo residual da fatura anterior", valor:restante,
        data: dataEscolhida, hora: nowTimeStr(), contaId: cartao.contaVinculada||null, cartaoId: cartao.id,
        competenciaFatura: monthKey(proxMes), contaDestinoId:null, categoriasIds:[], tagsIds:[],
        descricao:"", efetivado:false, dataEfetivacao:null, recorrencia:{ativa:false}, origemPagamentoGrupo:grupoPagamento
      });
    }
    await persist(); overlay.remove(); renderView(); onDone();
    showToast(restante>0.004 ? `Pagamento parcial registrado. Restante de ${fmtMoney(restante)} transferido para a próxima fatura.` : "Fatura paga.");
  };
}

    const status = (itens.length && itens.every(l=>l.efetivado)) ? "Paga" : (todayStr() < monthKey(mesFatura)+"-"+String(cartao.diaFechamento).padStart(2,"0") ? "Aberta" : "Fechada");

      <div class="portal-modal wide">
        <div class="portal-head">
          <h2 style="display:flex;align-items:center;gap:6px;"><strong>Fatura:</strong> <span style="display:flex;align-items:center;gap:3px;font-weight:400;">${entityCircleHtml(cartao.cor,cartao.icone)}${cartao.nome}</span>

              <button class="icon-btn" id="btnMesFaturaPrev">${ICONS.chevronLeft||'‹'}</button>
              <strong style="font-family:var(--font-display);font-size:16px;">${fmtMonthLabel(mesFatura)}</strong>
              <button class="icon-btn" id="btnMesFaturaNext">${ICONS.chevronRight||'›'}</button>
            </div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:600;justify-self:end;">Total: ${fmtMoney(total)}</div>
          </div>

            <thead><tr><th>Data/Hora</th><th>Nome</th><th>Categoria</th><th style="text-align:right">Valor</th></tr></thead>
            <tbody>
            ${itens.length? itens.map(l=>{
              const catPai = l.categoriasIds[0] ? categoriaById(l.categoriasIds[0]) : null;
              const subcat = l.categoriasIds[1] ? categoriaById(l.categoriasIds[1]) : null;
              return `<tr class="${l.efetivado?'cartao-pago':'cartao-pendente'} lanc-row" data-id="${l.id}" style="cursor:pointer;">
                <td>${fmtDateHora(l)}</td>
                <td>${l.nome||"—"}</td>
                <td>${Array.isArray(l.categoriasSplits)&&l.categoriasSplits.length>1 ? `<span class="cat-circle" style="background:#4A473E;color:#fff;">${ICONS.splitCat}</span>Multicategoria` : (subcat?`${catCircleHtmlSubcat(subcat)}${catPai?catPai.nome:''} › ${subcat.nome}`:(catPai?catCircleHtml(catPai)+catPai.nome:"—"))}</td>
                <td style="text-align:right;" class="${l.tipo==='despesa'?'neg':'pos'}">${fmtMoney(l.valor)}</td>
              </tr>`;
            }).join("")
              : `<tr><td colspan="6">${emptyState("Nenhum lançamento nesta fatura para o mês selecionado.")}</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>
        <div class="portal-foot">
          <div>${itens.length && status!=='Paga' ? `<button class="btn primary" id="btnPagarFatura">Pagar Fatura</button>` : ""}
          ${status==='Paga' ? `<button class="btn danger" id="btnReabrirFatura"><span class="tt-icon">${ICONS.repeat}</span> Reabrir a fatura</button>` : ""}</div>
          <button class="btn ghost" id="btnFechar">Fechar</button>
        </div>
      </div>`;
    overlay.querySelector(".close-x").onclick=()=>overlay.remove();
    overlay.querySelector("#btnFechar").onclick=()=>overlay.remove();
    overlay.querySelector("#btnMesFaturaPrev").onclick = ()=>{ mesFatura = new Date(mesFatura.getFullYear(), mesFatura.getMonth()-1, 1); draw(); };
    overlay.querySelector("#btnMesFaturaNext").onclick = ()=>{ mesFatura = new Date(mesFatura.getFullYear(), mesFatura.getMonth()+1, 1); draw(); };
    overlay.querySelectorAll(".lanc-row").forEach(tr=> tr.addEventListener("click", ()=>{ overlay.remove(); openLancamentoModal(tr.dataset.id); }));
    overlay.querySelectorAll("[data-efetivar]").forEach(dot=> dot.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const l = state.lancamentos.find(x=>x.id===dot.dataset.efetivar);
      l.efetivado = !l.efetivado;
      l.dataEfetivacao = l.efetivado ? (l.dataEfetivacao||nowLocalIso()) : l.dataEfetivacao;
      await persist(); draw();
    }));
    overlay.querySelectorAll("[data-mesfatura]").forEach(b=> b.addEventListener("click", (e)=>{
      e.stopPropagation();
      openMesFaturaPopover(b, state.lancamentos.find(x=>x.id===b.dataset.mesfatura), ()=>draw());
    }));
    const btnPagar = overlay.querySelector("#btnPagarFatura");
    if(btnPagar) btnPagar.onclick = ()=>{
      openPagarFaturaModal(cartao, itens, total, vencimento, ()=>{ draw(); });
    };
    const btnReabrir = overlay.querySelector("#btnReabrirFatura");
    if(btnReabrir) btnReabrir.onclick = async ()=>{
      const ok = await openConfirmPortal("Reabrir esta fatura e desfazer o pagamento (total ou parcial)? Todas as despesas voltarão para o status Previsto.", {danger:true});
      if(!ok) return;
      const gruposPagamento = new Set(itens.map(l=>l.grupoPagamento).filter(Boolean));
      itens.forEach(l=>{ l.efetivado = false; l.grupoPagamento = null; });
      if(gruposPagamento.size){
        state.lancamentos = state.lancamentos.filter(l=> !(l.origemPagamentoGrupo && gruposPagamento.has(l.origemPagamentoGrupo)));
      }
      await persist(true); renderView(); draw(); showToast("Fatura reaberta e pagamento desfeito.");
    };
    overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  }
  document.body.appendChild(overlay);
  draw();
}

function openMesFaturaPopover(triggerEl, lanc, onDone){
  const options = [];
  const base = new Date(lanc.data+"T00:00:00");
  for(let i=-1;i<=2;i++){
    const d = new Date(base.getFullYear(), base.getMonth()+i, 1);
    options.push({key:monthKey(d), label:fmtMonthLabel(d)});
  }
  openKebabMenu(triggerEl, options.map(o=>({
    label: o.label + ((lanc.competenciaFatura?lanc.competenciaFatura:monthKey(new Date(lanc.data+"T00:00:00")))===o.key ? " ✓" : ""),
    onClick: async ()=>{ lanc.competenciaFatura = o.key; await persist(); onDone(); }
  })));
}

   VIEW: ORÇAMENTO
========================================================= */
function valorPlanejadoEfetivo(o, monthDate){
  const mesKey = monthKey(monthDate);
  if(o.historicoValores && o.historicoValores.length){
    const aplicaveis = o.historicoValores.filter(h=> h.desde<=mesKey).sort((a,b)=> a.desde.localeCompare(b.desde));
    if(aplicaveis.length) return aplicaveis[aplicaveis.length-1].valor;
  }
  return o.valorPlanejado;
}
function realizadoOrcamento(o, monthDate, apenasComConta){
  const cat = categoriaById(o.categoriaId); if(!cat) return 0;
  const idsRelevantes = cat.categoriaPaiId ? [cat.id] : [cat.id, ...catFilhas(cat.id).map(c=>c.id)];
  if(cat.tipo==="investimento"){
    if(cat.nome==="Aportes" || cat.nome==="Aportes (orçamento)"){
      return state.investimentos.aportes.filter(a=> a.tipo==="aporte" && isInMonth(a.data, monthDate) && (!apenasComConta || a.contaId)).reduce((s,a)=>s+a.valor,0);
    }
    return state.investimentos.aportes.filter(a=> a.tipo==="aporte" && isInMonth(a.data, monthDate) && a.categoriaId && idsRelevantes.includes(a.categoriaId) && (!apenasComConta || a.contaId))
      .reduce((s,a)=>s+a.valor,0);
  }
  return lancamentosDoMes(monthDate).filter(l=> l.tipo===cat.tipo).reduce((s,l)=>{
    return s + partesCategoriaDoLancamento(l).filter(parte=> idsRelevantes.includes(parte.categoriaId) || idsRelevantes.includes(parte.subcategoriaId)).reduce((s2,parte)=>s2+parte.valor,0);
  }, 0);
}

let orcTabTipo = "entrada";
function renderOrcamento(root){
  const mesKey = monthKey(currentMonth);
  const TIPO_LABEL_ORC = {despesa:"Despesa", entrada:"Entrada", investimento:"Investimento"};
  const orcamentosDoMes = state.orcamentos.filter(o=>{
    const cat = categoriaById(o.categoriaId);
    if(!cat || cat.tipo!==orcTabTipo) return false;
    const dentroDoPeriodo = o.mesReferencia===mesKey || (!o.mesReferencia && (!o.validoApartirDe || mesKey>=monthKey(new Date(o.validoApartirDe+"T00:00:00"))));
    if(!dentroDoPeriodo) return false;
    return valorPlanejadoEfetivo(o, currentMonth) > 0;
  }).sort((a,b)=>{
    const catA = categoriaById(a.categoriaId), catB = categoriaById(b.categoriaId);
    return (catA?catA.nome:"").localeCompare(catB?catB.nome:"", 'pt-BR');
  });
  const tabs = [
    {tipo:"entrada", label:"Entradas", icon:"kpiArrowDown"},
    {tipo:"despesa", label:"Despesas", icon:"kpiArrowUp"},
    {tipo:"investimento", label:"Investimentos", icon:"kpiChart"},
  ];

  root.innerHTML = `
    <div class="tabs-card" style="justify-content:space-between;align-items:center;">
      <div style="display:flex;">
        ${tabs.map(t=>`<button class="tab-btn tab-${t.tipo} ${orcTabTipo===t.tipo?'active':''}" data-tab="${t.tipo}"><span class="tt-icon">${ICONS[t.icon]}</span>${t.label}</button>`).join("")}
      </div>
      <button class="btn-create" id="btnNovoOrc" style="margin-right:2px;"><span class="badge-plus">${ICONS.plus}</span> Orçamento</button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
      <table>
        <thead><tr><th>Categoria</th><th>Planejado</th><th>Realizado</th><th style="width:220px">Progresso</th><th></th></tr></thead>
        <tbody>
        ${orcamentosDoMes.length? orcamentosDoMes.map(o=>{
          const cat = categoriaById(o.categoriaId);
          const realizado = realizadoOrcamento(o, currentMonth);
          const valorPlanejadoMes = valorPlanejadoEfetivo(o, currentMonth);
          const pct = valorPlanejadoMes>0 ? Math.min(150, (realizado/valorPlanejadoMes*100)) : 0;
          const over = realizado > valorPlanejadoMes;
          const destacarNegativo = over && cat && cat.tipo!=="entrada";
          const corBarra = cat && cat.tipo==="entrada" ? "var(--type-entrada)" : cat && cat.tipo==="investimento" ? "var(--type-investimento)" : "var(--type-despesa)";
          return `<tr data-id="${o.id}" data-catid="${o.categoriaId}" class="orc-row" style="cursor:pointer;">
            <td>${cat?catCircleHtml(cat)+catLabel(cat.id):"—"}</td>
            <td>${fmtMoney(valorPlanejadoMes)}</td>
            <td class="${destacarNegativo?'neg':''}">${fmtMoney(realizado)}</td>
            <td><div style="display:flex;align-items:center;gap:8px;"><div class="progress-mini" style="flex:1;"><div style="width:${Math.min(100,pct)}%;background:${corBarra};"></div></div>
              <span class="mini-note" style="white-space:nowrap;">${pct.toFixed(0)}%</span></div></td>
            <td onclick="event.stopPropagation()"><button class="icon-btn danger" data-del-orc="${o.id}" title="Excluir">${ICONS.trash}</button></td>
          </tr>`;
        }).join("") : `<tr><td colspan="5">${emptyState("Nenhum orçamento definido para este mês.")}</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById("btnNovoOrc").onclick = ()=> openOrcamentoModal(null, orcTabTipo);
  root.querySelectorAll("[data-tab]").forEach(b=> b.onclick = ()=>{ orcTabTipo = b.dataset.tab; renderOrcamento(root); });
  root.querySelectorAll(".orc-row").forEach(tr=> tr.addEventListener("click", ()=> openOrcamentoModal(tr.dataset.id)));
  root.querySelectorAll("[data-del-orc]").forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    const oid = b.dataset.delOrc;
    const excluiu = await excluirOrcamentoComEscopo(oid);
    if(excluiu) renderOrcamento(root);
  });
}

async function excluirOrcamentoComEscopo(oid){
  const o = state.orcamentos.find(x=>x.id===oid);
  if(!o) return false;
  const escolha = await new Promise(resolve=>{
    const askOverlay = document.createElement("div");
    askOverlay.className = "portal-overlay";
    askOverlay.innerHTML = `
      <div class="portal-modal" style="max-width:420px;">
        <div class="portal-head"><h2>Excluir orçamento</h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          <p class="mini-note" style="margin-bottom:14px;">Excluir este orçamento:</p>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="mes">Somente o mês selecionado (${fmtMonthLabel(currentMonth)})</button>
            <button type="button" class="btn ghost" style="justify-content:flex-start;" data-opt="diante">Este e todos os meses seguintes</button>
          </div>
        </div>
        <div class="portal-foot"><div></div><button class="btn ghost" id="btnCancelAsk">Cancelar</button></div>
      </div>`;
    document.body.appendChild(askOverlay);
    function close(v){ askOverlay.remove(); resolve(v); }
    askOverlay.querySelector(".close-x").onclick=()=>close(null);
    askOverlay.querySelector("#btnCancelAsk").onclick=()=>close(null);
    askOverlay.querySelectorAll("[data-opt]").forEach(btn=> btn.onclick=()=>close(btn.dataset.opt));
    askOverlay.addEventListener("click", ev=>{ if(ev.target===askOverlay) close(null); });
  });
  if(!escolha) return false;
  const ok = await openConfirmPortal("Confirma a exclusão? Essa ação não pode ser desfeita.", {danger:true});
  if(!ok) return false;
  const mesKeyAtual = monthKey(currentMonth);
  if(escolha==="mes"){
    const valorAntes = valorPlanejadoEfetivo(o, currentMonth);
    const proxMesKey = monthKey(new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 1));
    o.historicoValores = [...(o.historicoValores||[]), {desde:mesKeyAtual, valor:0}, {desde:proxMesKey, valor:valorAntes}];
  } else {
    o.historicoValores = [...(o.historicoValores||[]), {desde:mesKeyAtual, valor:0}];
  }
  await persist(); showToast("Orçamento excluído.");
  return true;
}

function totalAportadoAtivo(ativoId, ateData){
  return state.investimentos.aportes.filter(a=>a.ativoId===ativoId && a.efetivado && !a.transferenciaGrupoId && (!ateData || a.data<=ateData))
    .reduce((s,a)=> s + (a.tipo==="resgate"? -a.valor : a.valor), 0);
}
function valorAtualAtivo(ativoId, ateData){
  const ativo = ativoById(ativoId);
  let upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativoId);
  if(ateData) upds = upds.filter(a=>a.data<=ateData);
  upds = upds.sort((a,b)=> a.data.localeCompare(b.data) || (a.criadoEm||"").localeCompare(b.criadoEm||""));
  const ultima = upds.length ? upds[upds.length-1] : null;
  const base = ultima ? ultima.valorAtual : (ativo?(ativo.saldoInicial||0):0);
  const dataBase = ultima ? ultima.data : null;
  const aportesDepois = state.investimentos.aportes.filter(a=>{
    if(a.ativoId!==ativoId || !a.efetivado) return false;
    if(dataBase){
      if(a.data<dataBase) return false;
      if(a.data===dataBase && (a.criadoEm||"")<=(ultima.criadoEm||"")) return false;
    }
    if(ateData && a.data>ateData) return false;
    return true;
  }).reduce((s,a)=> s + (a.tipo==="resgate"? -a.valor : a.valor), 0);
  return base + aportesDepois;
}
function baseAntesAtualizacao(ativoId, u){
  let baseAntes = valorAtualAtivo(ativoId, diaAnteriorA(u.data));
  const aportesMesmoDia = state.investimentos.aportes.filter(a=>a.ativoId===ativoId && a.efetivado && a.data===u.data && (a.criadoEm||"")<=(u.criadoEm||""))
    .reduce((s,a)=> s + (a.tipo==="resgate"? -a.valor : a.valor), 0);
  return baseAntes + aportesMesmoDia;
}
function rendimentoAcumuladoTotal(ativoId){
  const upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativoId).sort((a,b)=>a.data.localeCompare(b.data));
  let total = 0;
  upds.forEach(u=>{
    const baseAntes = baseAntesAtualizacao(ativoId, u);
    total += u.valorAtual - baseAntes;
  });
  return total;
}
function rentabilidadeAtivo(ativoId){
  const upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativoId).sort((a,b)=>a.data.localeCompare(b.data));
  if(upds.length<2) return {total:0, anual:0};
  const baseInicial = valorAtualAtivo(ativoId, diaAnteriorA(upds[0].data));
  if(baseInicial<=0) return {total:0, anual:0};
  const rendAcumulado = rendimentoAcumuladoTotal(ativoId);
  const totalPct = (rendAcumulado/baseInicial)*100;
  const dias = Math.max(1, (new Date(upds[upds.length-1].data+"T00:00:00") - new Date(upds[0].data+"T00:00:00")) / 86400000);
  const anos = dias/365;
  const anualPct = anos>=1 ? (Math.pow(1+totalPct/100, 1/anos)-1)*100 : totalPct;
  return {total:totalPct, anual:anualPct};
}
function calcPatrimonioInvestido(ateData){
  return state.investimentos.ativos.filter(a=>a.ativo && (!a.dataCriacao || !ateData || a.dataCriacao<=ateData)).reduce((s,a)=> s+valorAtualAtivo(a.id, ateData), 0);
}
function calcRentabilidadeMedia(){
  const ativos = state.investimentos.ativos.filter(a=>a.ativo);
  let baseTotal = 0, atualTotal = 0;
  ativos.forEach(a=>{
    const upds = state.investimentos.atualizacoes.filter(x=>x.ativoId===a.id).sort((x,y)=>x.data.localeCompare(y.data));
    if(upds.length<2) return;
    baseTotal += upds[0].valorAtual;
    atualTotal += upds[upds.length-1].valorAtual;
  });
  if(baseTotal<=0) return 0;
  return ((atualTotal-baseTotal)/baseTotal)*100;
}

function aportadoNoMes(ativoId, monthDate){
  return state.investimentos.aportes.filter(a=>a.ativoId===ativoId && a.efetivado && !a.transferenciaGrupoId && isInMonth(a.data, monthDate))
    .reduce((s,a)=> s + (a.tipo==="resgate"? -a.valor : a.valor), 0);
}
function rendimentoNoMes(ativoId, monthDate){
  const upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativoId).sort((a,b)=>a.data.localeCompare(b.data));
  let total = 0;
  upds.forEach(u=>{
    if(!isInMonth(u.data, monthDate)) return;
    const baseAntes = baseAntesAtualizacao(ativoId, u);
    total += u.valorAtual - baseAntes;
  });
  return total;
}
function rentabilidadeJanela(ativoId, meses){
  const dataInicioJanela = diaAnteriorA(primeiroDiaMes(new Date(currentMonth.getFullYear(), currentMonth.getMonth()-meses+1, 1)));
  const valorInicio = valorAtualAtivo(ativoId, dataInicioJanela);
  if(!valorInicio) return 0;
  let rendimentoAcumulado = 0;
  for(let i=0;i<meses;i++){
    const mesIter = new Date(currentMonth.getFullYear(), currentMonth.getMonth()-i, 1);
    rendimentoAcumulado += rendimentoNoMes(ativoId, mesIter);
  }
  return (rendimentoAcumulado/valorInicio)*100;
}
function rentabilidadeProjetadaAnual(ativoId){
  const taxasMensais = [];
  for(let i=0;i<3;i++){
    const mesIter = new Date(currentMonth.getFullYear(), currentMonth.getMonth()-i, 1);
    const inicioMesIter = diaAnteriorA(primeiroDiaMes(mesIter));
    const baseMes = valorAtualAtivo(ativoId, inicioMesIter);
    if(baseMes>0) taxasMensais.push(rendimentoNoMes(ativoId, mesIter)/baseMes);
  }
  if(!taxasMensais.length) return 0;
  const mediaMensal = taxasMensais.reduce((s,v)=>s+v,0)/taxasMensais.length;
  return (Math.pow(1+mediaMensal, 12)-1)*100;
}
function rentabilidadeMesTotal(rendimentoTotal){
  const fimMesAnterior = diaAnteriorA(primeiroDiaMes(currentMonth));
  let baseTotal = 0;
  state.investimentos.ativos.filter(a=>a.ativo).forEach(a=> baseTotal += valorAtualAtivo(a.id, fimMesAnterior));
  if(baseTotal<=0) return 0;
  return (rendimentoTotal/baseTotal)*100;
}

            <div style="flex:1;">

              <p class="mini-note" style="margin:2px 0 0;">${concluida?'🎉 Concluída':m.dataAlvo?(diasRestantes>=0?`${diasRestantes} dia(s) restantes`:`${Math.abs(diasRestantes)} dia(s) atrasada`):'Sem prazo definido'}</p>
            </div>
            <div style="display:flex;align-items:center;gap:2px;" onclick="event.stopPropagation()">
              <button class="icon-btn" data-editar-meta="${m.id}" title="Editar">${ICONS.edit}</button>
              <button class="icon-btn danger" data-excluir-meta="${m.id}" title="Excluir">${ICONS.trash}</button>
            </div>
          </div>
          <div class="progress-mini" style="margin-bottom:6px;"><div style="width:${pct}%;background:${concluida?'var(--positive)':m.cor};"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="mini-note" style="margin:0;">${fmtMoney(m.valorAtual)} de ${fmtMoney(m.valorAlvo)}</span>

          </div>
        </div>`;
      }).join("")}
    </div>` : emptyState("Nenhuma meta criada ainda. Que tal começar uma?")}
  `;
  document.getElementById("btnNovaMeta").onclick = ()=> openMetaModal(null);
  root.querySelectorAll("[data-meta]").forEach(el=> el.addEventListener("click", ()=> openMetaDetalheModal(el.dataset.meta)));
  root.querySelectorAll("[data-editar-meta]").forEach(b=> b.onclick = ()=> openMetaModal(b.dataset.editarMeta));
  root.querySelectorAll("[data-excluir-meta]").forEach(b=> b.onclick = async ()=>{
    const ok = await openConfirmPortal("Excluir esta meta? Essa ação não pode ser desfeita.", {danger:true});
    if(!ok) return;
    state.metas = state.metas.filter(m=>m.id!==b.dataset.excluirMeta);
    await persist(); renderMetas(root); showToast("Meta excluída.");
  });
}
function openMetaDetalheModal(metaId){
  const meta = state.metas.find(m=>m.id===metaId);
  if(!meta) return;
  const overlay = document.createElement("div");
  overlay.className = "portal-overlay";
  let tipoMov = "entrada";
  let concluidaState = meta.concluida;

  function draw(){
    const pct = meta.valorAlvo>0 ? Math.min(100, (meta.valorAtual/meta.valorAlvo*100)) : 0;
    const pctReal = meta.valorAlvo>0 ? (meta.valorAtual/meta.valorAlvo*100) : 0;
    const concluida = concluidaState || pctReal>=100;
    const movimentos = sortByData((meta.movimentos||[]).slice());
    overlay.innerHTML = `
      <div class="portal-modal">
        <div class="portal-head"><h2 style="display:flex;align-items:center;gap:8px;">${catCircleHtml({cor:meta.cor,icone:meta.icone})}${meta.nome}${concluida?' 🎉':''}</h2>
          <div style="display:flex;align-items:center;gap:4px;">
            <button class="close-x">&times;</button>
          </div>
        </div>
        <div class="portal-body">
          ${meta.descricao ? `<p class="mini-note" style="margin:-4px 0 14px;">${meta.descricao}</p>` : ""}
          <div class="progress-mini" style="margin-bottom:8px;height:10px;"><div style="width:${pct}%;background:${concluida?'var(--positive)':meta.cor};"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <span style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);">${fmtMoney(meta.valorAtual)}</span><span class="mini-note" style="margin:0;"> de ${fmtMoney(meta.valorAlvo)}</span>
            <span style="font-weight:700;font-family:var(--font-display);font-size:18px;">${pctReal.toFixed(0)}%</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
            <h4 style="margin:0;font-size:13px;white-space:nowrap;">Meta alcançada</h4>
            <span class="switch ${concluida?'on':''}" id="fMetaConcluida"><span class="knob"></span></span>
          </div>
          <div class="field-row" style="grid-template-columns:2.4fr 0.9fr auto;align-items:flex-end;gap:12px;margin-bottom:16px;">
            <label class="field" id="lblValorMeta" style="margin-bottom:0;"><span>Valor</span>
              <div style="display:flex;align-items:center;gap:10px;">
                <input id="fValorMovMeta" style="flex:1;min-width:0;">
                <div class="mov-tipo-toggle">
                  <button type="button" class="mov-tipo-opt entrada ${tipoMov==='entrada'?'active':''}" data-tipo-mov="entrada" title="Entrada">${ICONS.arrowUp} Entrada</button>
                  <button type="button" class="mov-tipo-opt saida ${tipoMov==='saida'?'active':''}" data-tipo-mov="saida" title="Saída">${ICONS.arrowDown} Saída</button>
                </div>
              </div>
            </label>
            <label class="field" style="margin-bottom:0;">Data <input type="date" id="fDataMovMeta" value="${todayStr()}"></label>
            <button type="button" class="btn primary small" id="btnAddMov" style="justify-content:center;white-space:nowrap;">Adicionar</button>
          </div>
          <h4 style="margin:0 0 8px;font-size:12.5px;text-transform:none;letter-spacing:normal;color:var(--gray-700);font-weight:600;">Lançamentos</h4>
          <div class="table-scroll" style="max-height:220px;overflow-y:auto;">
          <table>
            <thead><tr><th>Data</th><th>Tipo</th><th style="text-align:right">Valor</th><th></th></tr></thead>
            <tbody>
            ${movimentos.length ? movimentos.map(mv=>`<tr>
              <td>${fmtDate(mv.data)}</td>
              <td><span class="chip ${mv.tipo==='entrada'?'entrada':'despesa'}">${mv.tipo==='entrada'?'Entrada':'Saída'}</span></td>
              <td style="text-align:right;" class="${mv.tipo==='entrada'?'pos':'neg'}">${mv.tipo==='entrada'?'+':'-'}${fmtMoney(mv.valor)}</td>
              <td onclick="event.stopPropagation()"><button class="icon-btn danger" data-del-mov="${mv.id}" title="Excluir">${ICONS.trash}</button></td>
            </tr>`).join("") : `<tr><td colspan="4">${emptyState("Nenhum lançamento nesta meta ainda.")}</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>
        <div class="portal-foot"><div></div><button class="btn ghost" id="btnFechar">Fechar</button></div>
      </div>`;
    maskMoney(overlay.querySelector("#fValorMovMeta"), 0);
    overlay.querySelector(".close-x").onclick = ()=>overlay.remove();
    overlay.querySelector("#btnFechar").onclick = ()=>overlay.remove();
    overlay.querySelector("#fMetaConcluida").onclick = async ()=>{
      concluidaState = !concluidaState;
      meta.concluida = concluidaState;
      await persist(); renderView(); draw();
    };
    overlay.querySelectorAll("[data-tipo-mov]").forEach(b=> b.onclick = ()=>{
