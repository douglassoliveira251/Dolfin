      overlay.querySelectorAll("[data-tipo-mov]").forEach(x=> x.classList.toggle("active", x.dataset.tipoMov===tipoMov));
    });
    overlay.querySelector("#btnAddMov").onclick = async ()=>{
      const valor = moneyVal(overlay.querySelector("#fValorMovMeta"));
      if(!valor){ showToast("Informe um valor maior que zero."); return; }
      const data = overlay.querySelector("#fDataMovMeta").value || todayStr();
      meta.movimentos = meta.movimentos || [];
      meta.movimentos.push({ id:uid("metamov"), data, valor, tipo:tipoMov });
      meta.valorAtual = meta.movimentos.reduce((s,mv)=> s + (mv.tipo==="saida"?-mv.valor:mv.valor), 0);
      if(meta.valorAtual >= meta.valorAlvo && meta.valorAlvo>0){ meta.concluida = true; concluidaState = true; }
      await persist(); renderView(); draw(); showToast("Progresso atualizado.");
    };
    overlay.querySelectorAll("[data-del-mov]").forEach(b=> b.onclick = async ()=>{
      meta.movimentos = (meta.movimentos||[]).filter(mv=>mv.id!==b.dataset.delMov);
      meta.valorAtual = meta.movimentos.reduce((s,mv)=> s + (mv.tipo==="saida"?-mv.valor:mv.valor), 0);
      await persist(); renderView(); draw(); showToast("Lançamento removido.");
    });
    overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  }
  document.body.appendChild(overlay);
  draw();
}
function openMetaModal(id){
  const editing = !!id;
  const base = editing ? state.metas.find(m=>m.id===id) : {id:null, nome:"", valorAlvo:0, valorAtual:0, dataAlvo:null, cor:COLOR_PRESETS[Math.floor(Math.random()*COLOR_PRESETS.length)], icone:"target", concluida:false, descricao:""};
  const overlay = document.createElement("div");
  overlay.className = "portal-overlay";
  overlay.innerHTML = `
    <div class="portal-modal">
      <div class="portal-head"><h2>${editing?"Editar meta":"Nova meta"}</h2><button class="close-x">&times;</button></div>
      <div class="portal-body">
        <div class="field-row" style="grid-template-columns:auto 1fr auto;align-items:flex-end;gap:14px;">
          <div class="field" style="align-items:center;">
            ${iconPickerHtml("fIcone", base.icone)}
          </div>
          <label class="field">Nome <input type="text" id="fNome" value="${base.nome}" placeholder="Ex: Viagem, Reserva de emergência..."></label>
          <div class="field" style="align-items:center;">
            <span style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Cor</span>
            ${colorPickerHtml("fCor", base.cor)}
          </div>
        </div>
        <div class="field-row">
          <label class="field">Valor alvo <input id="fValorAlvo"></label>
          <label class="field">Data alvo (opcional) <input type="date" id="fDataAlvo" value="${base.dataAlvo||''}"></label>
        </div>
        <label class="field">Descrição (opcional) <textarea id="fDescricaoMeta" rows="2" placeholder="Descreva o objetivo desta meta...">${base.descricao||''}</textarea></label>
        ${!editing ? `<label class="field">Valor já acumulado (opcional) <input id="fValorAtual"></label>` : `
        <div class="toggle-row">
          <div class="ti"><h4>Meta alcançada</h4><p>Marca esta meta como concluída, independente do valor acumulado.</p></div>
          ${toggleSwitchHtml("fConcluida", base.concluida)}
        </div>`}
      </div>
      <div class="portal-foot">
        <div>${editing?`<button class="btn danger" id="btnDel">Excluir</button>`:""}</div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Salvar</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  maskMoney(overlay.querySelector("#fValorAlvo"), base.valorAlvo);
  const valorAtualEl = overlay.querySelector("#fValorAtual");
  if(valorAtualEl) maskMoney(valorAtualEl, base.valorAtual);
  wireIconPicker(overlay, "fIcone");
  wireColorPicker(overlay, "fCor");
  overlay.querySelector(".close-x").onclick = ()=>overlay.remove();
  overlay.querySelector("#btnCancel").onclick = ()=>overlay.remove();
  let concluidaState = base.concluida;
  const fConcluidaEl = overlay.querySelector("#fConcluida");
  if(fConcluidaEl) fConcluidaEl.onclick = ()=>{ concluidaState = !concluidaState; fConcluidaEl.classList.toggle("on", concluidaState); };
  const btnDel = overlay.querySelector("#btnDel");
  if(btnDel) btnDel.onclick = async ()=>{
    const ok = await openConfirmPortal("Excluir esta meta?", {danger:true});
    if(!ok) return;
    state.metas = state.metas.filter(m=>m.id!==id);
    await persist(); overlay.remove(); renderView(); showToast("Meta excluída.");
  };
  overlay.querySelector("#btnSave").onclick = async ()=>{
    const nome = overlay.querySelector("#fNome").value.trim();
    if(!nome){ showToast("Informe um nome para a meta."); return; }
    const valorAlvo = moneyVal(overlay.querySelector("#fValorAlvo"));
    const dataAlvo = overlay.querySelector("#fDataAlvo").value || null;
    const cor = overlay.querySelector("#fCor").value;
    const icone = overlay.querySelector("#fIcone").value;
    const descricao = overlay.querySelector("#fDescricaoMeta").value.trim();
    if(editing){
      Object.assign(base, {nome, valorAlvo, dataAlvo, cor, icone, concluida:concluidaState, descricao});
    } else {
      const valorAtual = valorAtualEl ? moneyVal(valorAtualEl) : 0;
      const movimentos = valorAtual>0 ? [{id:uid("metamov"), data:todayStr(), valor:valorAtual, tipo:"entrada"}] : [];
      state.metas.push({ id:uid("meta"), nome, valorAlvo, valorAtual, dataAlvo, cor, icone, concluida:false, criadoEm:new Date().toISOString(), descricao, movimentos });
    }
    await persist(); overlay.remove(); renderView(); showToast("Meta salva.");
  };
}
function renderInvestimentos(root){
  const fimMesRef = ultimoDiaMes(currentMonth);
  const ativos = state.investimentos.ativos.filter(a=>a.ativo && (!a.dataCriacao || a.dataCriacao<=fimMesRef));
  const aportadoTotal = ativos.reduce((s,a)=>s+aportadoNoMes(a.id, currentMonth),0);
  const rendimentoTotal = ativos.reduce((s,a)=>s+rendimentoNoMes(a.id, currentMonth),0);
  const atualTotal = calcPatrimonioInvestido(ultimoDiaMes(currentMonth));
  const rentMesTotal = rentabilidadeMesTotal(rendimentoTotal);
  const receitasMes = lancamentosDoMes(currentMonth).filter(l=>l.tipo==="entrada" && l.efetivado).reduce((s,l)=>s+l.valor,0);
  const aportadoPct = receitasMes>0 ? (aportadoTotal/receitasMes*100) : 0;

  function linhaAtivo(a){
    const saldoInicioMes = valorAtualAtivo(a.id, diaAnteriorA(primeiroDiaMes(currentMonth)));
    const aportadoMes = aportadoNoMes(a.id, currentMonth);
    const rendimentoMes = rendimentoNoMes(a.id, currentMonth);
    const valorTotal = valorAtualAtivo(a.id, ultimoDiaMes(currentMonth));
    const rent = rentabilidadeAtivo(a.id);
    const rent1m = rentabilidadeJanela(a.id, 1);
    const rent3m = rentabilidadeJanela(a.id, 3);
    const rent12m = rentabilidadeJanela(a.id, 12);
    const rentProjetada = rentabilidadeProjetadaAnual(a.id);
    const cat = a.categoriaId ? categoriaById(a.categoriaId) : null;
    return `<tr data-id="${a.id}" class="ativo-row" style="cursor:pointer;">
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nome}</td>
      <td>${cat?catCircleHtml(cat)+cat.nome:"—"}</td>
      <td>${fmtMoney(saldoInicioMes)}</td>
      <td>${fmtMoney(aportadoMes)}</td>
      <td class="${rendimentoMes<0?'neg':'pos'}">${fmtMoney(rendimentoMes)}</td>
      <td style="font-weight:600;">${fmtMoney(valorTotal)}</td>
      <td class="${rent1m<0?'neg':'pos'}">${rent1m.toFixed(2)}%</td>
      <td class="${rent3m<0?'neg':'pos'}">${rent3m.toFixed(2)}%</td>
      <td class="${rent12m<0?'neg':'pos'}">${rent12m.toFixed(2)}% <span class="mini-note" style="display:inline;">/${rentProjetada.toFixed(2)}%</span></td>
      <td onclick="event.stopPropagation()"><button class="icon-btn kebab-btn" data-kebab-ativo="${a.id}">${ICONS.kebab}</button></td>
    </tr>`;
  }

  const contasComAtivo = state.contas.filter(c=> ativos.some(a=>a.contaId===c.id));
  const semConta = ativos.filter(a=>!a.contaId || !contaById(a.contaId));

  root.innerHTML = `
    <div class="view-header">
      <div></div>
      <button class="btn-create" id="btnNovoAtivo"><span class="badge-plus">${ICONS.plus}</span> Novo ativo</button>
    </div>
    <div class="kpi-grid cols5">
      <div class="kpi-card"><div class="lbl">Patrimônio inicial do mês</div><div class="val">${fmtMoney(calcPatrimonioInvestido(diaAnteriorA(monthKey(currentMonth)+"-01")))}</div><div class="mini-note">Antes de rendimentos e aportes</div></div>
      <div class="kpi-card"><div class="lbl">Aportado no mês</div><div class="val">${fmtMoney(aportadoTotal)}</div><div class="mini-note">${aportadoPct.toFixed(1)}% das receitas</div></div>
      <div class="kpi-card"><div class="lbl">Rendimento no mês</div><div class="val ${rendimentoTotal<0?'neg':'pos'}">${fmtMoney(rendimentoTotal)}</div></div>
      <div class="kpi-card"><div class="lbl">Patrimônio Atual</div><div class="val">${fmtMoney(atualTotal)}</div></div>
      <div class="kpi-card"><div class="lbl">Rentabilidade no mês</div><div class="val ${rentMesTotal<0?'neg':'pos'}">${rentMesTotal.toFixed(2)}%</div></div>
    </div>
    ${ativos.length ? [...contasComAtivo.map(c=>({conta:c, itens:ativos.filter(a=>a.contaId===c.id)})), ...(semConta.length?[{conta:null, itens:semConta}]:[])].map(grupo=>{
      const totSaldoInicio = grupo.itens.reduce((s,a)=> s+valorAtualAtivo(a.id, diaAnteriorA(primeiroDiaMes(currentMonth))), 0);
      const totAportado = grupo.itens.reduce((s,a)=> s+aportadoNoMes(a.id, currentMonth), 0);
      const totRendimento = grupo.itens.reduce((s,a)=> s+rendimentoNoMes(a.id, currentMonth), 0);
      const totValorTotal = grupo.itens.reduce((s,a)=> s+valorAtualAtivo(a.id, ultimoDiaMes(currentMonth)), 0);
      const n = grupo.itens.length || 1;
      const media1m = grupo.itens.reduce((s,a)=> s+rentabilidadeJanela(a.id, 1), 0) / n;
      const media3m = grupo.itens.reduce((s,a)=> s+rentabilidadeJanela(a.id, 3), 0) / n;
      const media12m = grupo.itens.reduce((s,a)=> s+rentabilidadeJanela(a.id, 12), 0) / n;
      const mediaProjetada = grupo.itens.reduce((s,a)=> s+rentabilidadeProjetadaAnual(a.id), 0) / n;
      return `
      <div class="table-wrap" style="margin-bottom:16px;">
        <div class="table-toolbar">
          ${grupo.conta ? `<strong style="display:flex;align-items:center;">${entityCircleHtml(grupo.conta.cor, grupo.conta.icone)}${grupo.conta.nome}</strong>` : `<strong class="mini-note">Sem conta associada</strong>`}

          <tfoot><tr style="font-weight:700;border-top:2px solid var(--line);">
            <td>Total</td><td></td>
            <td>${fmtMoney(totSaldoInicio)}</td>
            <td>${fmtMoney(totAportado)}</td>
            <td class="${totRendimento<0?'neg':'pos'}">${fmtMoney(totRendimento)}</td>
            <td>${fmtMoney(totValorTotal)}</td>
            <td class="${media1m<0?'neg':'pos'}">${media1m.toFixed(2)}%</td>
            <td class="${media3m<0?'neg':'pos'}">${media3m.toFixed(2)}%</td>
            <td class="${media12m<0?'neg':'pos'}">${media12m.toFixed(2)}% <span class="mini-note" style="display:inline;font-weight:400;">/${mediaProjetada.toFixed(2)}%</span></td>
            <td></td>
          </tr></tfoot>
        </table>
        </div>
      </div>`;
    }).join("") : `<div class="table-wrap"><div class="table-scroll">${emptyState("Nenhum ativo cadastrado ainda.")}</div></div>`}
  `;
  document.getElementById("btnNovoAtivo").onclick = ()=> openAtivoModal(null);
  root.querySelectorAll(".ativo-row").forEach(tr=> tr.addEventListener("click", ()=> openAtivoExtratoModal(tr.dataset.id)));
  root.querySelectorAll("[data-kebab-ativo]").forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const aid = b.dataset.kebabAtivo;
    openKebabMenu(b, [
      {label:"Editar", onClick:()=> openAtivoModal(aid)},
      {label:"Excluir", danger:true, onClick: async ()=>{
        const ok = await openConfirmPortal("Excluir este ativo e todo seu histórico de aportes?", {danger:true});
        if(!ok) return;
        state.investimentos.ativos = state.investimentos.ativos.filter(a=>a.id!==aid);
        state.investimentos.aportes = state.investimentos.aportes.filter(a=>a.ativoId!==aid);
        state.investimentos.atualizacoes = state.investimentos.atualizacoes.filter(a=>a.ativoId!==aid);
        await persist(); renderInvestimentos(root); showToast("Ativo excluído.");
      }},
    ]);
  });
}

function openAtivoExtratoModal(ativoId){
  const ativo = ativoById(ativoId);
  if(!ativo) return;
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";

  function buildEntries(){
    const aportes = state.investimentos.aportes.filter(a=>a.ativoId===ativoId).map(a=>({
      id:a.id, data:a.data, tipo: a.transferenciaGrupoId ? "transferencia" : a.tipo, valor:a.tipo==="resgate"?-a.valor:a.valor, kind:"aporte", efetivado:a.efetivado
    }));
    const upds = state.investimentos.atualizacoes.filter(a=>a.ativoId===ativoId).sort((a,b)=>a.data.localeCompare(b.data));
    const rendimentos = upds.map((u)=>{
      const baseAntes = baseAntesAtualizacao(ativoId, u);
      const delta = u.valorAtual - baseAntes;
      return { id:u.id, data:u.data, tipo:"rendimento", valor:delta, kind:"atualizacao" };
    });
    const entries = sortByData([...aportes, ...rendimentos]);
    if(ativo.saldoInicial){
      entries.push({ id:"saldoinicial-"+ativoId, data:null, tipo:"saldo_inicial", valor:ativo.saldoInicial, kind:"saldoInicial" });
    }
    return entries;
  }

  function draw(){
    const entries = buildEntries();
    const totalAportado = totalAportadoAtivo(ativoId);
    const valorAtual = valorAtualAtivo(ativoId);
    const rent = rentabilidadeAtivo(ativoId);
    const rendimentoMesAtivo = rendimentoNoMes(ativoId, currentMonth);
    overlay.innerHTML = `
      <div class="portal-modal wide">
        <div class="portal-head"><h2><strong>Extrato:</strong> <span style="font-weight:400;">${(()=>{ const c=ativo.contaId?contaById(ativo.contaId):null; return c?`${entityCircleHtml(c.cor,c.icone)}${c.nome} - ${ativo.nome}`:ativo.nome; })()}</span></h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          <div class="kpi-grid cols4" style="margin-bottom:16px;">
            <div class="kpi-card"><div class="lbl">Total aportado</div><div class="val">${fmtMoney(totalAportado)}</div></div>
            <div class="kpi-card"><div class="lbl">Valor atual</div><div class="val">${fmtMoney(valorAtual)}</div></div>
            <div class="kpi-card"><div class="lbl">Rendimento no mês</div><div class="val ${rendimentoMesAtivo<0?'neg':'pos'}">${fmtMoney(rendimentoMesAtivo)}</div></div>
            <div class="kpi-card"><div class="lbl">Rentabilidade (total / ano)</div><div class="val ${rent.total<0?'neg':'pos'}">${rent.total.toFixed(2)}% <span class="mini-note" style="display:inline;">/ ${rent.anual.toFixed(2)}% ano</span></div></div>
          </div>
          <div class="table-scroll">
          <table>
            <thead><tr><th>Data</th><th>Tipo</th><th style="text-align:right">Valor</th><th></th></tr></thead>
            <tbody>
            ${entries.length? entries.map(e=>{
              const label = e.tipo==="saldo_inicial"?"Saldo inicial":e.tipo==="transferencia"?"Transferência":e.tipo==="aporte"?"Aporte":e.tipo==="resgate"?"Resgate":"Rendimento";
              const cor = e.valor<0?"neg":"pos";
              return `<tr>
                <td>${e.data?fmtDate(e.data):'—'}</td>
                <td><span class="chip ${e.tipo==='rendimento'?'investimento':e.tipo==='transferencia'?'transferencia':e.tipo==='saldo_inicial'?'entrada':(e.tipo==='resgate'?'despesa':'entrada')}">${label}</span></td>
                <td style="text-align:right;" class="${cor}">${e.valor<0?'-':'+'}${fmtMoney(Math.abs(e.valor))}</td>
                <td style="white-space:nowrap;">
                  <button class="icon-btn" data-edit-entry="${e.id}" data-kind="${e.kind}">${ICONS.edit}</button>
                  ${e.kind!=="saldoInicial"?`<button class="icon-btn danger" data-del-entry="${e.id}" data-kind="${e.kind}">${ICONS.trash}</button>`:""}
                </td>
              </tr>`;
            }).join("") : `<tr><td colspan="4">${emptyState("Nenhuma movimentação registrada ainda.")}</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>
        <div class="portal-foot">
          <div style="display:flex;gap:8px;">
            <button class="btn small" id="btnExtratoAporte" style="background:var(--type-entrada);color:#fff;border-color:var(--type-entrada);"><span class="tt-icon">${ICONS.plus}</span> Aporte</button>
            <button class="btn small ghost" id="btnExtratoResgate" style="color:var(--type-despesa);border-color:var(--type-despesa);"><span class="tt-icon">${ICONS.swap}</span> Resgate</button>
            <button class="btn small ghost" id="btnExtratoAtualizar" style="border-color:var(--gray-400);"><span class="tt-icon">${ICONS.repeat}</span> Atualizar valor</button>
            <button class="btn small ghost" id="btnExtratoTransferir" style="border-color:var(--gray-400);"><span class="tt-icon">${ICONS.swap}</span> Transferir</button>
          </div>
          <button class="btn ghost" id="btnFechar">Fechar</button>
        </div>
      </div>`;
    overlay.querySelector(".close-x").onclick=()=>overlay.remove();
    overlay.querySelector("#btnFechar").onclick=()=>overlay.remove();
    overlay.querySelector("#btnExtratoAporte").onclick = ()=>{ overlay.remove(); openAporteModal(ativoId,"aporte",null,()=>openAtivoExtratoModal(ativoId)); };
    overlay.querySelector("#btnExtratoResgate").onclick = ()=>{ overlay.remove(); openAporteModal(ativoId,"resgate",null,()=>openAtivoExtratoModal(ativoId)); };
    overlay.querySelector("#btnExtratoAtualizar").onclick = ()=>{ overlay.remove(); openAtualizarValorModal(ativoId,null,()=>openAtivoExtratoModal(ativoId)); };
    overlay.querySelector("#btnExtratoTransferir").onclick = ()=>{ overlay.remove(); openTransferenciaAtivoModal(ativoId, ()=>openAtivoExtratoModal(ativoId)); };
    overlay.querySelectorAll("[data-edit-entry]").forEach(b=> b.onclick = ()=>{
      overlay.remove();
      if(b.dataset.kind==="aporte"){
        const a = state.investimentos.aportes.find(x=>x.id===b.dataset.editEntry);
        openAporteModal(ativoId, a.tipo, a.id, ()=>openAtivoExtratoModal(ativoId));
      } else if(b.dataset.kind==="saldoInicial"){
        openAtivoModal(ativoId);
      } else {
        openAtualizarValorModal(ativoId, b.dataset.editEntry, ()=>openAtivoExtratoModal(ativoId));
      }
    });
    overlay.querySelectorAll("[data-del-entry]").forEach(b=> b.onclick = async ()=>{
      const ok = await openConfirmPortal("Excluir este registro?", {danger:true});
      if(!ok) return;
      if(b.dataset.kind==="aporte"){
        const aporteRemovido = state.investimentos.aportes.find(x=>x.id===b.dataset.delEntry);
        if(aporteRemovido && aporteRemovido.lancamentoVinculadoId){
          state.lancamentos = state.lancamentos.filter(l=>l.id!==aporteRemovido.lancamentoVinculadoId);
        }
        state.investimentos.aportes = state.investimentos.aportes.filter(x=>x.id!==b.dataset.delEntry);
      } else {
        state.investimentos.atualizacoes = state.investimentos.atualizacoes.filter(x=>x.id!==b.dataset.delEntry);
      }
      await persist(true); draw(); renderView();
    });
    overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  }
  document.body.appendChild(overlay);
  draw();
}

function openAtivoModal(id){
  const editing = !!id;
  const catsInvestimento = state.categorias.filter(c=>c.tipo==="investimento" && !c.arquivada);
  let form = editing ? JSON.parse(JSON.stringify(state.investimentos.ativos.find(a=>a.id===id))) : {id:null,nome:"",categoriaId:catsInvestimento[0]?catsInvestimento[0].id:null,contaId:state.contas[0]?state.contas[0].id:null,saldoInicial:0,ativo:true};
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";

  function draw(){
    overlay.innerHTML = `
      <div class="portal-modal">
        <div class="portal-head"><h2>${editing?"Editar ativo":"Novo ativo"}</h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          <label class="field">Nome <input type="text" id="fNome" value="${form.nome}" placeholder="Ex: Tesouro Selic 2029, PETR4, Fundo XP..."></label>
          <label class="field">Categoria
            ${customSelectHtml("fCat", catsInvestimento.map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:catCircleHtml(c)})), form.categoriaId, "Selecionar categoria")}
          </label>
          <button type="button" class="btn ghost small" id="btnNovaCatInv"><span class="tt-icon">${ICONS.plus}</span> Nova categoria de investimento</button>
          <label class="field" style="margin-top:12px;">Conta associada
            ${customSelectHtml("fConta", state.contas.filter(c=>!c.arquivada).map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:entityCircleHtml(c.cor,c.icone)})), form.contaId, "— nenhuma —")}
          </label>
          <label class="field" style="margin-top:12px;">Saldo inicial (ajuste, se necessário)
            <input id="fSaldoInicialAtivo">
          </label>
        </div>
        <div class="portal-foot"><div></div>
          <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Salvar</button></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    maskMoney(overlay.querySelector("#fSaldoInicialAtivo"), form.saldoInicial||0);
    function syncAtivoForm(){
      const nEl = overlay.querySelector("#fNome"); if(nEl) form.nome = nEl.value;
      const sEl = overlay.querySelector("#fSaldoInicialAtivo"); if(sEl) form.saldoInicial = moneyVal(sEl);
    }
    wireCustomSelect(overlay, "fCat", catsInvestimento.map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:catCircleHtml(c)})), (v)=>{ syncAtivoForm(); form.categoriaId=v; draw(); });
    wireCustomSelect(overlay, "fConta", state.contas.filter(c=>!c.arquivada).map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:entityCircleHtml(c.cor,c.icone)})), (v)=>{ syncAtivoForm(); form.contaId=v; draw(); });
    overlay.querySelector(".close-x").onclick=()=>overlay.remove();
    overlay.querySelector("#btnCancel").onclick=()=>overlay.remove();
    overlay.querySelector("#btnNovaCatInv").onclick = ()=>{
      overlay.remove();
      openCategoriaModal(null, null, "investimento");
    };
    overlay.querySelector("#btnSave").onclick = async ()=>{
      const nome = overlay.querySelector("#fNome").value.trim();
      if(!nome){ showToast("Informe um nome."); return; }
      const categoriaId = form.categoriaId || null;
      if(!categoriaId){ showToast("Cadastre uma categoria de investimento primeiro."); return; }
      const data = { id:editing?id:uid("ativo"), nome, categoriaId, contaId:form.contaId||null, saldoInicial:moneyVal(overlay.querySelector("#fSaldoInicialAtivo")), dataCriacao: editing?(form.dataCriacao||todayStr()):todayStr(), ativo:true };
      if(editing){ const idx=state.investimentos.ativos.findIndex(a=>a.id===id); state.investimentos.ativos[idx]=data; }
      else state.investimentos.ativos.push(data);
      await persist(); overlay.remove(); renderView(); showToast("Ativo salvo.");
    };
  }
  draw();
}

function openTransferenciaAtivoModal(ativoOrigemId, onDone){
  const ativos = state.investimentos.ativos.filter(a=>a.ativo);
  const overlay = document.createElement("div");
  overlay.className = "portal-overlay";
  const ativoOptions = ativos.map(a=>{
    const conta = a.contaId ? contaById(a.contaId) : null;
    return {id:a.id, label: conta ? `${conta.nome} - ${a.nome}` : a.nome, color: conta?conta.cor:(a.cor||"#9C978A"), iconHtml: conta?entityCircleHtml(conta.cor,conta.icone):catCircleHtml({cor:a.cor||"#9C978A",icone:a.icone||"investment"})};
  });
  overlay.innerHTML = `
    <div class="portal-modal">
      <div class="portal-head"><h2>Transferir entre ativos</h2><button class="close-x">&times;</button></div>
      <div class="portal-body">
        <div class="field-row">
          <label class="field">Origem
            ${customSelectHtml("fAtivoOrigem", ativoOptions, ativoOrigemId, "Selecionar ativo")}
          </label>
          <label class="field">Destino
            ${customSelectHtml("fAtivoDestino", ativoOptions, null, "Selecionar ativo")}
          </label>
        </div>
        <div class="field-row">
          <label class="field">Valor <input id="fValorTransf"></label>
          <label class="field">Data <input type="date" id="fDataTransf" value="${todayStr()}"></label>
        </div>
        <p class="mini-note">Cria um resgate no ativo de origem e um aporte de mesmo valor no ativo de destino. Aparece como transferência no extrato e não afeta o total aportado nem o rendimento de nenhum dos dois ativos — só o valor atual muda. Não afeta o saldo de nenhuma conta bancária.</p>
      </div>
      <div class="portal-foot"><div></div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Transferir</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  maskMoney(overlay.querySelector("#fValorTransf"), 0);
  let origemSel = ativoOrigemId || null;
  let destinoSel = null;
  wireCustomSelect(overlay, "fAtivoOrigem", ativoOptions, (v)=>{ origemSel = v; });
  wireCustomSelect(overlay, "fAtivoDestino", ativoOptions, (v)=>{ destinoSel = v; });
  overlay.querySelector(".close-x").onclick = ()=>{ overlay.remove(); if(onDone) onDone(); };
  overlay.querySelector("#btnCancel").onclick = ()=>{ overlay.remove(); if(onDone) onDone(); };
  overlay.querySelector("#btnSave").onclick = async ()=>{
    const origemId = origemSel || overlay.querySelector("#fAtivoOrigem").value;
    const destinoId = destinoSel || overlay.querySelector("#fAtivoDestino").value;
    const valor = moneyVal(overlay.querySelector("#fValorTransf"));
    const data = overlay.querySelector("#fDataTransf").value || todayStr();
    if(!origemId || !destinoId){ showToast("Selecione os dois ativos."); return; }
    if(origemId===destinoId){ showToast("Selecione ativos diferentes."); return; }
    if(!valor){ showToast("Informe um valor maior que zero."); return; }
    const grupoId = uid("transf");
    state.investimentos.aportes.push({ id:uid("aporte"), ativoId:origemId, data, valor, tipo:"resgate", categoriaId:null, tagsIds:[], contaId:null, efetivado:true, transferenciaGrupoId:grupoId, criadoEm:new Date().toISOString() });
    state.investimentos.aportes.push({ id:uid("aporte"), ativoId:destinoId, data, valor, tipo:"aporte", categoriaId:null, tagsIds:[], contaId:null, efetivado:true, transferenciaGrupoId:grupoId, criadoEm:new Date().toISOString() });
    await persist(); overlay.remove(); renderView(); showToast("Transferência entre ativos registrada.");
    if(onDone) onDone();
  };
}

function openAporteModal(ativoId, tipo, aporteId, onDone){
  if(!state.investimentos.ativos.length){
    showToast("Cadastre um ativo antes de lançar um aporte.");
    openAtivoModal(null);
    return;
  }
  const editing = !!aporteId;
  const existing = editing ? state.investimentos.aportes.find(a=>a.id===aporteId) : null;
  const catsInvestimento = state.categorias.filter(c=>c.tipo==="investimento" && !c.arquivada);
  let form = existing ? JSON.parse(JSON.stringify(existing)) : { ativoId: ativoId||state.investimentos.ativos[0].id, categoriaId:null, tagsIds:[], valor:0, contaId:null, efetivado:true, data: monthKey(currentMonth)===monthKey(new Date())?todayStr():ultimoDiaMes(currentMonth) };
  tipo = form.tipo || tipo;
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";
  document.body.appendChild(overlay);

  function draw(){
    const ativo = ativoById(form.ativoId);
    function ativoLabel(a){
      const c = a.contaId ? contaById(a.contaId) : null;
      return c ? `${c.nome} - ${a.nome}` : a.nome;
    }
    function ativoLabelComIcone(a){
      const c = a.contaId ? contaById(a.contaId) : null;
      return c ? `${entityCircleHtml(c.cor,c.icone)}${c.nome} - ${a.nome}` : a.nome;
    }
    overlay.innerHTML = `
      <div class="portal-modal">
        <div class="portal-head"><h2>${editing?"Editar":"Novo"} ${tipo==="aporte"?"aporte":"resgate"}</h2><button class="close-x">&times;</button></div>
        <div class="portal-body">
          ${!ativoId ? `<label class="field">Ativo
            <select id="fAtivo">${state.investimentos.ativos.map(a=>`<option value="${a.id}" ${form.ativoId===a.id?'selected':''}>${ativoLabel(a)}</option>`).join("")}</select>
          </label>` : `<p class="mini-note" style="margin-bottom:12px;display:flex;align-items:center;">Ativo:&nbsp;<strong style="display:flex;align-items:center;">${ativo?ativoLabelComIcone(ativo):""}</strong></p>`}
          <div class="field-row">
            <label class="field">Valor <input id="fValor"></label>
            <label class="field">Data <input type="date" id="fData" value="${form.data||todayStr()}"></label>
          </div>
          <label class="field">${tipo==="aporte"?"Debitar da conta":"Creditar na conta"} (opcional)
            ${customSelectHtml("fContaAporte", state.contas.filter(c=>!c.arquivada).map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:entityCircleHtml(c.cor,c.icone)})), form.contaId, "— não afetar saldo de conta —")}
          </label>
          <div class="field-row">
            <label class="field">Tags
              ${tagsTriggerHtml("fTagsAporte", form.tagsIds)}
            </label>
            <label class="field">
              <span>Efetivado?</span>
              <span class="switch ${form.efetivado?'on':''}" id="fEfetivado" style="margin-top:6px;"><span class="knob"></span></span>
            </label>
          </div>
          <p class="mini-note">${tipo==="aporte"?"O valor será somado ao total investido neste ativo.":"O valor será subtraído do total investido neste ativo."}${form.contaId?" A conta selecionada terá o saldo ajustado de acordo.":""}</p>
        </div>
        <div class="portal-foot"><div></div>
          <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Salvar</button></div>
        </div>
      </div>`;
    maskMoney(overlay.querySelector("#fValor"), form.valor);
    overlay.querySelector(".close-x").onclick=()=>{ overlay.remove(); if(onDone) onDone(); };
    overlay.querySelector("#btnCancel").onclick=()=>{ overlay.remove(); if(onDone) onDone(); };
    const fAtivoEl = overlay.querySelector("#fAtivo");
    if(fAtivoEl) fAtivoEl.onchange = e=>{ form.ativoId = e.target.value; };
    overlay.querySelector("#fEfetivado").onclick = ()=>{
      form.valor = moneyVal(overlay.querySelector("#fValor"));
      form.contaId = overlay.querySelector("#fContaAporte").value||null;
      form.efetivado = !form.efetivado;
      draw();
    };
    wireCustomSelect(overlay, "fContaAporte", state.contas.filter(c=>!c.arquivada).map(c=>({id:c.id,label:c.nome,color:c.cor,iconHtml:entityCircleHtml(c.cor,c.icone)})), (v)=>{ form.valor = moneyVal(overlay.querySelector("#fValor")); form.contaId = v||null; draw(); });
    function onToggleTagAporte(tagId){
      form.tagsIds = form.tagsIds.includes(tagId) ? form.tagsIds.filter(x=>x!==tagId) : [...form.tagsIds, tagId];
      const selTags = form.tagsIds.map(id=>state.tags.find(t=>t.id===id)).filter(Boolean);
      const trig = overlay.querySelector("#fTagsAporte_trigger");
      if(trig){
        trig.innerHTML = `${selTags.map(t=>`<span class="tag-token">${t.nome}</span>`).join("")}<input type="text" id="fTagsAporte_search" placeholder="${selTags.length?'':'Buscar ou criar tag...'}" autocomplete="off">`;
        wireTagsPopover(overlay, "fTagsAporte", form.tagsIds, onToggleTagAporte);
      }
    }
    wireTagsPopover(overlay, "fTagsAporte", form.tagsIds, onToggleTagAporte);
    overlay.querySelector("#btnSave").onclick = async ()=>{
      const valor = moneyVal(overlay.querySelector("#fValor"));
      if(!valor){ showToast("Informe um valor maior que zero."); return; }
      form.contaId = overlay.querySelector("#fContaAporte").value || null;
      form.data = overlay.querySelector("#fData").value||todayStr();
      form.valor = valor;
      form.tipo = tipo;
      let aporteFinal;
      if(editing){
        const idx = state.investimentos.aportes.findIndex(a=>a.id===aporteId);
        aporteFinal = Object.assign({}, form, {id:aporteId, criadoEm: state.investimentos.aportes[idx].criadoEm});
        state.investimentos.aportes[idx] = aporteFinal;
      } else {
        aporteFinal = Object.assign({}, form, {id:uid("aporte"), criadoEm: new Date().toISOString()});
        state.investimentos.aportes.push(aporteFinal);
      }
      await persist(); overlay.remove(); renderView(); showToast(tipo==="aporte"?"Aporte registrado.":"Resgate registrado.");
      if(onDone) onDone();
    };
  }
  draw();
}

function openAtualizarValorModal(ativoId, atualId, onDone){
  const ativo = ativoById(ativoId);
  const editing = !!atualId;
  const existing = editing ? state.investimentos.atualizacoes.find(a=>a.id===atualId) : null;
  const overlay = document.createElement("div");
  overlay.className="portal-overlay";
  overlay.innerHTML = `
    <div class="portal-modal">
      <div class="portal-head"><h2>${editing?"Editar":"Atualizar"} valor — ${ativo.nome}</h2><button class="close-x">&times;</button></div>
      <div class="portal-body">
        <div class="field-row">
          <label class="field">Valor atual de mercado <input id="fValor"></label>
          <label class="field">Data <input type="date" id="fData" value="${existing?existing.data:(monthKey(currentMonth)===monthKey(new Date())?todayStr():ultimoDiaMes(currentMonth))}"></label>
        </div>
        <p class="mini-note">A diferença em relação à atualização anterior é registrada automaticamente como rendimento (positivo ou negativo) no extrato do ativo.</p>
      </div>
      <div class="portal-foot"><div></div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSave">Salvar</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  maskMoney(overlay.querySelector("#fValor"), existing?existing.valorAtual:valorAtualAtivo(ativoId));
  overlay.querySelector(".close-x").onclick=()=>{ overlay.remove(); if(onDone) onDone(); };
  overlay.querySelector("#btnCancel").onclick=()=>{ overlay.remove(); if(onDone) onDone(); };
  overlay.querySelector("#btnSave").onclick = async ()=>{
    const valorAtual = moneyVal(overlay.querySelector("#fValor"));
    const data = overlay.querySelector("#fData").value||todayStr();
    if(editing){
      const idx = state.investimentos.atualizacoes.findIndex(a=>a.id===atualId);
      state.investimentos.atualizacoes[idx] = { id:atualId, ativoId, data, valorAtual, criadoEm: state.investimentos.atualizacoes[idx].criadoEm };
    } else {
      state.investimentos.atualizacoes.push({ id:uid("atual"), ativoId, data, valorAtual, criadoEm: new Date().toISOString() });
    }
    await persist(); overlay.remove(); renderView(); showToast("Valor atualizado.");
    if(onDone) onDone();
  };
}

          <img id="cropImg" src="${imgSrc}" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;">
        </div>
        <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="width:${SIZE}px;margin-top:16px;">
        <p class="mini-note" style="margin-top:6px;">Arraste para posicionar, use o controle para dar zoom.</p>
      </div>
      <div class="portal-foot"><div></div>
        <div style="display:flex;gap:10px;"><button class="btn ghost" id="btnCancel">Cancelar</button><button class="btn primary" id="btnSalvarCrop">Selecionar e salvar</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const img = overlay.querySelector("#cropImg");
  const stage = overlay.querySelector("#cropStage");
  const zoomEl = overlay.querySelector("#cropZoom");
  let natW=0, natH=0, baseScale=1, scale=1, offX=0, offY=0;
  let dragging=false, startX=0, startY=0, startOffX=0, startOffY=0;

  function clampOffsets(){
    const w = natW*baseScale*scale, h = natH*baseScale*scale;
    offX = Math.min(0, Math.max(SIZE-w, offX));
    offY = Math.min(0, Math.max(SIZE-h, offY));
  }
  function applyTransform(){
    clampOffsets();
    img.style.width = (natW*baseScale*scale)+"px";
    img.style.height = (natH*baseScale*scale)+"px";
    img.style.transform = `translate(${offX}px, ${offY}px)`;
  }
  img.onload = ()=>{
    natW = img.naturalWidth; natH = img.naturalHeight;
    baseScale = Math.max(SIZE/natW, SIZE/natH);
    scale = 1;
    offX = (SIZE - natW*baseScale)/2;
    offY = (SIZE - natH*baseScale)/2;
    applyTransform();
  };
  stage.addEventListener("pointerdown", (e)=>{ dragging=true; startX=e.clientX; startY=e.clientY; startOffX=offX; startOffY=offY; stage.style.cursor="grabbing"; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e)=>{ if(!dragging) return; offX = startOffX + (e.clientX-startX); offY = startOffY + (e.clientY-startY); applyTransform(); });
  stage.addEventListener("pointerup", ()=>{ dragging=false; stage.style.cursor="grab"; });
  stage.addEventListener("wheel", (e)=>{ e.preventDefault(); scale = Math.min(3, Math.max(1, scale - e.deltaY*0.001)); zoomEl.value = scale; applyTransform(); }, {passive:false});
  zoomEl.oninput = (e)=>{ scale = Number(e.target.value); applyTransform(); };

  overlay.querySelector(".close-x").onclick = ()=>overlay.remove();
  overlay.querySelector("#btnCancel").onclick = ()=>overlay.remove();
  overlay.querySelector("#btnSalvarCrop").onclick = ()=>{
    const canvas = document.createElement("canvas");
    const OUT = 240;
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext("2d");
    const drawW = natW*baseScale*scale, drawH = natH*baseScale*scale;
    const k = OUT/SIZE;
    ctx.drawImage(img, offX*k, offY*k, drawW*k, drawH*k);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
    overlay.remove();
    onDone(dataUrl);
  };
  overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
}
let configTabAtiva = "perfil";
function renderConfig(root){
  const cfg = state.configuracoes;
  const p = state.perfil || {};
  const tabs = [
    {id:"perfil", label:"Perfil", icon:"detail"},
    {id:"personalizacao", label:"Personalização", icon:"config"},
    {id:"arquivo", label:"Arquivo Base", icon:"dashboard"},
    {id:"sobre", label:"Sobre", icon:"info"},
  ];
  root.innerHTML = `
    <div class="view-header">
      <div></div>
    </div>
    <div class="tabs-card">
      ${tabs.map(t=>`<button class="tab-btn ${configTabAtiva===t.id?'active':''}" data-config-tab="${t.id}"><span class="tt-icon">${ICONS[t.icon]}</span>${t.label}</button>`).join("")}
    </div>

    <div id="configTabBody"></div>
  `;
  root.querySelectorAll("[data-config-tab]").forEach(b=> b.onclick = ()=>{
    configTabAtiva = b.dataset.configTab;
    root.querySelectorAll("[data-config-tab]").forEach(btn=> btn.classList.toggle("active", btn.dataset.configTab===configTabAtiva));
    renderConfigTab(root);
  });
  renderConfigTab(root);
}
function renderConfigTab(root){
  const cfg = state.configuracoes;
  const p = state.perfil || {};
  const body = document.getElementById("configTabBody");
  if(configTabAtiva==="perfil"){
    body.innerHTML = `
      <div class="card">
        <h3>Perfil</h3>
        <div style="display:flex;align-items:flex-end;gap:20px;margin-bottom:20px;">

            <span id="perfilAvatarPreview" style="width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#fff;font-weight:700;font-size:20px;overflow:hidden;background-size:cover;background-position:center;"></span>
            <button class="icon-btn" id="btnEscolherFoto" title="Escolher foto" style="position:absolute;bottom:-2px;right:-2px;background:var(--surface);border:2px solid var(--bg);width:22px;height:22px;">${ICONS.edit}</button>

            <label class="field" style="margin-bottom:0;">Nome <input type="text" id="fPerfilNome" value="${p.nome||''}" placeholder="Seu nome"></label>
            <label class="field" style="margin-bottom:0;">E-mail <input type="text" id="fPerfilEmail" value="${p.email||''}" placeholder="seu@email.com"></label>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;">

      </div>
      <div id="cropModalHost"></div>
    `;
    const fFoto = document.getElementById("fFotoPerfil");
    document.getElementById("btnEscolherFoto").onclick = ()=> fFoto.click();
    const avatarPrev = document.getElementById("perfilAvatarPreview");
    let fotoTemp = p.fotoDataUrl || null;
    function refreshAvatarPreview(){
      if(fotoTemp){ avatarPrev.style.backgroundImage = `url(${fotoTemp})`; avatarPrev.textContent=""; }
      else { avatarPrev.style.backgroundImage = "none"; avatarPrev.textContent = (document.getElementById("fPerfilNome").value.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase())||"?"; }
    }
    refreshAvatarPreview();
    document.getElementById("fPerfilNome").oninput = refreshAvatarPreview;
    fFoto.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=> openCropFotoModal(reader.result, (croppedDataUrl)=>{ fotoTemp = croppedDataUrl; refreshAvatarPreview(); });
      reader.readAsDataURL(file);
    };
    document.getElementById("btnSalvarPerfil").onclick = async ()=>{
      state.perfil = { nome: document.getElementById("fPerfilNome").value.trim(), email: document.getElementById("fPerfilEmail").value.trim(), fotoDataUrl: fotoTemp };
      await persist();
      renderProfileCard();
      showToast("Perfil salvo.");
    };
  } else if(configTabAtiva==="personalizacao"){
    body.innerHTML = `
      <div class="card">
        <h3>Personalização</h3>
        <div class="toggle-row">
          <div class="ti">
            <h4>Orçamento afeta o saldo previsto</h4>
            <p>Quando ativado, o valor ainda não gasto de cada orçamento planejado (Entrada, Despesa ou Investimento) é somado ao Saldo Previsto do Dashboard. Quando desativado, o Saldo Previsto considera apenas os lançamentos já registrados no mês.</p>
          </div>
          ${toggleSwitchHtml("toggleOrcPrevisto", cfg.orcamentoAfetaPrevisto)}
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Mostrar apenas contas com saldo</h4>
            <p>Quando ativado, contas com saldo zerado ficam ocultas nas listagens de Contas e no Dashboard.</p>
          </div>
          ${toggleSwitchHtml("toggleApenasSaldo", cfg.mostrarApenasContasComSaldo)}
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Modo escuro</h4>
            <p>Alterna o tema visual do aplicativo para um fundo escuro.</p>
          </div>
          ${toggleSwitchHtml("toggleTemaEscuro", cfg.temaEscuro)}
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Ordenar lançamentos do mais novo para o mais antigo</h4>
            <p>Quando desativado, as listas mostram do mais antigo para o mais novo.</p>
          </div>
          ${toggleSwitchHtml("toggleOrdenacao", cfg.ordenacaoDecrescente)}
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Fuso horário</h4>
            <p>Usado para calcular "hoje" e os horários exibidos nos lançamentos.</p>
          </div>
          <select id="fFusoHorario" style="width:auto;">
            <option value="-05:00" ${cfg.fusoHorario==='-05:00'?'selected':''}>-05:00 (Acre)</option>
            <option value="-04:00" ${cfg.fusoHorario==='-04:00'?'selected':''}>-04:00 (Amazonas)</option>
            <option value="-03:00" ${(!cfg.fusoHorario || cfg.fusoHorario==='-03:00')?'selected':''}>-03:00 (Brasília)</option>
          </select>
        </div>
        <div class="toggle-row">
          <div class="ti">
            <h4>Ocultar valores ao abrir</h4>
            <p>Os valores financeiros já começam ocultos toda vez que você reabrir o Dolfin.</p>
          </div>
          ${toggleSwitchHtml("toggleOcultarAoAbrir", cfg.ocultarValoresAoAbrir)}
        </div>
      </div>
    `;
    const sw = document.getElementById("toggleOrcPrevisto");
    sw.onclick = async ()=>{
      state.configuracoes.orcamentoAfetaPrevisto = !state.configuracoes.orcamentoAfetaPrevisto;
      await persist();
      renderConfigTab(root);
      showToast("Preferência salva.");
    };
    document.getElementById("toggleApenasSaldo").onclick = async ()=>{
      state.configuracoes.mostrarApenasContasComSaldo = !state.configuracoes.mostrarApenasContasComSaldo;
      await persist();
      renderConfigTab(root);
      showToast("Preferência salva.");
    };
    document.getElementById("toggleTemaEscuro").onclick = async ()=>{
      await alternarTema();
      renderConfigTab(root);
    };
    document.getElementById("toggleOrdenacao").onclick = async ()=>{
      state.configuracoes.ordenacaoDecrescente = !state.configuracoes.ordenacaoDecrescente;
      await persist();
      renderConfigTab(root);
      showToast("Preferência salva.");
    };
    document.getElementById("fFusoHorario").onchange = async (e)=>{
      state.configuracoes.fusoHorario = e.target.value;
      await persist();
      showToast("Fuso horário salvo.");
    };
    document.getElementById("toggleOcultarAoAbrir").onclick = async ()=>{
      state.configuracoes.ocultarValoresAoAbrir = !state.configuracoes.ocultarValoresAoAbrir;
      await persist();
      renderConfigTab(root);
      showToast("Preferência salva.");
    };
  } else if(configTabAtiva==="arquivo"){
    body.innerHTML = `
      <div class="card">
        <h3>Arquivo base</h3>
        <p class="mini-note" style="margin-bottom:14px;">Arquivo conectado: <strong>${fileHandle?fileHandle.name:"—"}</strong></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn primary" id="btnCfgSalvar">Salvar agora</button>
          <button class="btn" id="btnCfgTrocar">Carregar outro arquivo</button>
          <button class="btn danger-solid" id="btnCfgDesconectar">Desconectar</button>
        </div>
      </div>
    `;
    document.getElementById("btnCfgSalvar").onclick = async ()=>{ await persist(true); showToast("Arquivo salvo."); };
    document.getElementById("btnCfgTrocar").onclick = async ()=>{
      const ok = await openConfirmPortal("Isso desconecta o arquivo atual e abre o seletor para escolher outro. Continuar?");
      if(!ok) return;
      await disconnect();
    };
    document.getElementById("btnCfgDesconectar").onclick = async ()=>{
      const ok = await openConfirmPortal("Deseja desconectar deste arquivo? Seus dados continuam salvos localmente.", {okLabel:"Desconectar"});
      if(ok) disconnect();
    };
  } else if(configTabAtiva==="sobre"){
    body.innerHTML = `
      <div class="card">
        <button class="btn ghost" id="btnSobre">Sobre o Dolfin</button>
      </div>
    `;
    document.getElementById("btnSobre").onclick = ()=> openSobreModal();
  }
}

/* =========================================================
   BOOTSTRAP
========================================================= */
function aplicarTema(){
  document.body.classList.toggle("dark-theme", !!state.configuracoes.temaEscuro);
  const icon = document.getElementById("navDarkModeIcon");
  const label = document.getElementById("navDarkModeLabel");
  if(icon) icon.innerHTML = state.configuracoes.temaEscuro ? ICONS.sun : ICONS.moon;
  if(label) label.textContent = state.configuracoes.temaEscuro ? "Modo claro" : "Modo escuro";
}
async function alternarTema(){
  state.configuracoes.temaEscuro = !state.configuracoes.temaEscuro;
  aplicarTema();
  await persist();
}
function bootApp(){
  document.getElementById("connectScreen").style.display = "none";
  document.getElementById("app").classList.add("ready");
  lastSyncAt = state.meta && state.meta.lastModified ? new Date(state.meta.lastModified) : new Date();
  updateLastSyncLabel();
  const syncIcon = document.getElementById("syncSpinIcon");
  const searchIcon = document.getElementById("buscaGlobalSearchIcon");
  if(searchIcon) searchIcon.innerHTML = ICONS.search;
  if(syncIcon) syncIcon.innerHTML = ICONS.sync;
  const sairIcon = document.getElementById("btnSairTopbar");
  if(sairIcon) sairIcon.innerHTML = ICONS.logout;
  document.getElementById("globalFab").style.display = "flex";
  lancPageSize = state.configuracoes.lancPageSizePadrao || 10;
  valoresOcultos = !!state.configuracoes.ocultarValoresAoAbrir;
  updateOlhoBtn();
  aplicarTema();
  renderNav();
  renderMonthLabel();
  renderView();
}
document.getElementById("navDarkMode").addEventListener("click", (e)=>{ e.preventDefault(); alternarTema(); });

  const ok = await openConfirmPortal("Deseja sair e desconectar deste arquivo? Seus dados continuam salvos localmente.", {okLabel:"Sair"});
  if(ok) disconnect();
});

document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") persist(true); });
document.addEventListener("keydown", (e)=>{
  if(e.key!=="Escape") return;
  const overlays = document.querySelectorAll(".portal-overlay");
  if(!overlays.length) return;
  const last = overlays[overlays.length-1];
  const closeBtn = last.querySelector(".close-x");
  if(closeBtn) closeBtn.click();
  else last.remove();
});
window.addEventListener("beforeunload", ()=>{ if(fileHandle) persist(true); });

// attempt silent reconnect on load
(async function init(){
  const ok = await tryReconnect();
  if(!ok){
    document.getElementById("connectScreen").style.display = "flex";
  }
})();

})();
